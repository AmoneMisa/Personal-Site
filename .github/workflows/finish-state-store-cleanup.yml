name: Finish state store cleanup

on:
  push:
    branches:
      - refactor/remove-redis-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-redis-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rename state-store compatibility APIs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_store = root / 'server/utils/redis.ts'
          new_store = root / 'server/utils/stateStore.ts'
          if old_store.exists():
              new_store.write_text(old_store.read_text(encoding='utf-8'), encoding='utf-8')
              old_store.unlink()

          replacements = {
              '~~/server/utils/redis': '~~/server/utils/stateStore',
              '../server/utils/redis.ts': '../server/utils/stateStore.ts',
              'useRedis': 'useStateStore',
              'redisReady': 'stateStoreReady',
          }
          paths = list((root / 'server').rglob('*.ts')) + list((root / 'tests').rglob('*.mjs'))
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          if new_store.exists():
              text = new_store.read_text(encoding='utf-8')
              text = text.replace('Compatibility adapter for the old Redis-shaped store API.', 'Persistent application state store backed by the Docker state volume.')
              text = text.replace('Redis-style keys', 'logical keys')
              text = text.replace('class PersistentKvCompat', 'class PersistentStateStore')
              text = text.replace('PersistentKvCompat | undefined', 'PersistentStateStore | undefined')
              text = text.replace('new PersistentKvCompat()', 'new PersistentStateStore()')
              text = text.replace('Redis contract', 'atomic lock contract')
              text = text.replace('Compatibility readiness check for callers that used to wait for Redis.', 'Readiness check for the persistent state directory.')
              text = text.replace('readonly options = { enableOfflineQueue: false }\n  readonly status = \'ready\'\n\n  on(_event: string, _handler: EventHandler) { return this }\n  once(_event: string, _handler: EventHandler) { return this }\n  off(_event: string, _handler: EventHandler) { return this }\n\n', '')
              text = text.replace('type EventHandler = (...args: unknown[]) => void\n\n', '')
              new_store.write_text(text, encoding='utf-8')

          for path in (root / 'backend/src/routers').glob('*.py'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('..utils.redis_client import get_redis', '..utils.state_store import get_state_store')
              updated = updated.replace('get_redis', 'get_state_store')
              if path.name == 'dockerhub.py':
                  updated = updated.replace('# Redis helpers', '# State-store helpers')
                  updated = updated.replace('def rget_json(redis, key: str):', 'def cache_get_json(state_store, key: str):')
                  updated = updated.replace('def rset_json(redis, key: str, obj, ttl: int):', 'def cache_set_json(state_store, key: str, obj, ttl: int):')
                  updated = updated.replace('redis=Depends(get_state_store)', 'state_store=Depends(get_state_store)')
                  updated = updated.replace('rget_json(redis,', 'cache_get_json(state_store,')
                  updated = updated.replace('rset_json(redis,', 'cache_set_json(state_store,')
                  updated = updated.replace('await redis.get(', 'await state_store.get(')
                  updated = updated.replace('await redis.set(', 'await state_store.set(')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          legacy_backend = root / 'backend/src/utils/redis_client.py'
          if legacy_backend.exists():
              legacy_backend.unlink()

          state_test = root / 'tests/state-store.test.mjs'
          if state_test.exists():
              text = state_test.read_text(encoding='utf-8')
              text = text.replace('preserves Redis NX compare-and-delete lock contract', 'preserves NX compare-and-delete lock semantics')
              state_test.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run application tests
        run: npm test
      - name: Compile backend state-store modules
        run: python -m py_compile backend/src/utils/state_store.py backend/src/routers/pdf.py backend/src/routers/dockerhub.py backend/src/routers/countryIndices.py
      - name: Verify legacy runtime names are gone
        shell: bash
        run: |
          test ! -e server/utils/redis.ts
          test ! -e backend/src/utils/redis_client.py
          if grep -RInE 'from redis|import redis|ioredis|redis\[hiredis\]|utils\.redis_client|server/utils/redis|useRedis|redisReady|get_redis' server backend package.json package-lock.json docker-compose.yml .env.example; then
            echo 'Legacy Redis runtime reference remains'
            exit 1
          fi
      - name: Commit cleanup if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "State-store naming is already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server backend tests
          git commit -m "refactor(state): remove Redis compatibility names"
          git push origin HEAD:refactor/remove-redis-cleanup
