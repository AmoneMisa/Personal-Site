name: Finalize hiring normalization

on:
  push:
    branches: [ fix/hiring-localization-normalization ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final normalization adjustments
        run: python .github/patches/finalize-hiring-normalization.py
      - name: Commit finalized hiring changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(hiring): finalize role normalization'
          git push origin HEAD:fix/hiring-localization-normalization
