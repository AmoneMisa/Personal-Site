name: Finish shared hiring lexicon cleanup

on:
  push:
    paths:
      - '.github/workflows/final-shared-lexicon-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Replace remaining consumer lexicons
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          LEXICON_SHA = 'e18bc9abe2cb5ad6d199e5a7281d2bcf52f79da2'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{label}: start marker not found')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:a] + replacement + text[b:]

          path = Path('package.json')
          data = json.loads(path.read_text())
          data['dependencies']['@whiteslove/parsing-lexicon'] = f'https://github.com/AmoneMisa/parsing-lexicon/archive/{LEXICON_SHA}.tar.gz'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          Path('shared/jobSkills.ts').write_text("""export {
            SKILL_CATALOG,
            SKILL_KEYWORDS,
            SKILL_META,
            buildSkillRegex,
            canonicalSkillName,
            escapeRegex,
            extractSkillDetails,
            extractSkillNames,
            getSkillMeta,
            normalizeSkillText,
          } from '@whiteslove/parsing-lexicon/hiring-skills'
          export type {
            SkillDefinition,
            SkillDetail,
            SkillMeta,
          } from '@whiteslove/parsing-lexicon/hiring-skills'
          """)

          path = Path('server/utils/hiringLexicon.ts')
          text = path.read_text()
          text = replace_once(text, """export {
            detectCandidateFeatureCodes,
            detectCandidateRelocationPreference,
            detectDegreeRequirement as detectSharedDegreeRequirement,
            detectHiringScopeSignals as detectSharedHiringScopeSignals,
            detectManagementRole as detectSharedManagementRole,
            extractCandidateContactHours,
            extractCandidateGoalRole,
            extractCandidateSalaryField,
            extractCandidateSkillField,
            extractCandidateTargetContext,
            extractCandidateWorkHistory,
            isCandidateNonTargetContext,
          } from '@whiteslove/parsing-lexicon/hiring-semantics'
          """, """export {
            detectCandidateFeatureCodes,
            detectCandidateProfessionLabels,
            detectCandidateRelocationPreference,
            detectCandidateRemotePreference,
            detectDegreeRequirement as detectSharedDegreeRequirement,
            detectHiringScopeSignals as detectSharedHiringScopeSignals,
            detectManagementRole as detectSharedManagementRole,
            extractCandidateContactHours,
            extractCandidateGoalField,
            extractCandidateGoalRole,
            extractCandidateLocationField,
            extractCandidateRoleField,
            extractCandidateSalaryField,
            extractCandidateSkillField,
            extractCandidateTargetContext,
            extractCandidateWorkHistory,
            isCandidateNonRoleValue,
            isCandidateNonTargetContext,
            isCandidateStatusOnly,
            isFlexibleCandidateRole,
          } from '@whiteslove/parsing-lexicon/hiring-semantics'
          """, 'hiringLexicon exports')
          path.write_text(text)

          path = Path('server/utils/hiringNormalize.ts')
          text = path.read_text()
          text = replace_once(text, """  detectCandidateFeatureCodes,
            detectCandidateRelocationPreference,
            detectProfessionMatches,
          """, """  detectCandidateFeatureCodes,
            detectCandidateRelocationPreference,
            detectCandidateRemotePreference,
            detectEmploymentTypes,
            detectProfessionMatches,
          """, 'normalize imports 1')
          text = replace_once(text, """  isCandidateNonTargetContext,
            resolveSharedProfessionContext,
          """, """  isCandidateNonRoleValue,
            isCandidateNonTargetContext,
            isFlexibleCandidateRole,
            resolveSharedProfessionContext,
          """, 'normalize imports 2')
          text = replace_once(text, "if (FLEXIBLE_ROLE_RE.test(target)) return ['Any Role']", "if (isFlexibleCandidateRole(target)) return ['Any Role']", 'flexible role call')
          text = replace_once(text, 'if (NON_ROLE_RE.test(target)) return []', 'if (isCandidateNonRoleValue(target)) return []', 'non-role call')
          text = replace_between(text, 'const REMOTE_POSITIVE_RE =', 'function numericExperience(', """export function normalizeRemotePreference(
            raw: boolean | null | undefined,
            text: string,
            origin: CvProfile['origin'],
          ): boolean | null {
            const shared = detectCandidateRemotePreference(text)
            if (shared != null) return shared
            if ((origin ?? 'telegram') === 'telegram' && raw === false) return null
            return raw ?? null
          }

          """, 'remote semantics')
          text = replace_between(text, 'export function normalizeEmploymentTypes(', '/** Removes text ligatures emitted by icon fonts', """export function normalizeEmploymentTypes(text: string, raw?: string | null): CandidateEmploymentType[] {
            return detectEmploymentTypes(`${raw || ''}\n${text}`)
          }

          """, 'employment semantics')
          text = replace_between(text, 'const FLEXIBLE_ROLE_RE =', 'function normalizeCandidateEducation(', '', 'standalone role semantics')
          path.write_text(text)

          path = Path('server/utils/hiringQuality.ts')
          text = path.read_text()
          text = replace_once(text, "import { detectMentionedProfessions } from './hiringNormalize'\n", """import { detectMentionedProfessions } from './hiringNormalize'
          import {
            detectCandidateProfessionLabels,
            detectCandidateRemotePreference,
            detectLexiconCity,
            extractCandidateGoalField,
            extractCandidateLocationField,
            extractCandidateRoleField,
            extractCandidateSkillField,
            extractCandidateTargetContext,
            isCandidateStatusOnly,
            normalizeHiringCountry,
            resolveSharedCountryFromText,
          } from './hiringLexicon'
          """, 'quality imports')
          text = replace_between(text, 'const STATUS_ONLY_RE =', 'function field(', '', 'quality local catalogs')
          text = replace_between(text, 'function intentLines(', 'function repairProfessions(', """function candidateTargetContext(profile: CvProfile, text: string): string {
            const roleFieldRaw = extractCandidateRoleField(text)
            const roleField = roleFieldRaw && !isCandidateStatusOnly(cleanToken(roleFieldRaw)) ? roleFieldRaw : ''
            const goal = extractCandidateGoalField(text) || ''
            const target = extractCandidateTargetContext(text)
            const headline = text.split('\n').map((line) => line.trim()).filter(Boolean).slice(0, 4).join('\n')
            return [profile.role || '', ...(profile.professions || []), roleField, goal, target, headline].join('\n')
          }

          """, 'quality target context')
          text = replace_between(text, 'function repairProfessions(', 'function structuredName(', """function repairProfessions(profile: CvProfile, text: string): string[] {
            const current = unique(profile.professions?.length ? profile.professions : [profile.role || ''])
            const target = candidateTargetContext(profile, text)
            const semantic = [...detectCandidateProfessionLabels(target)]
            if (semantic.length) return unique(semantic)
            if (!current.length) {
              const technologies = extractCandidateSkillField(text) || ''
              const inferred = [...detectCandidateProfessionLabels('', `${technologies} ${(profile.skills || []).join(' ')}`)]
              if (inferred.length) return unique(inferred)
              const headline = text.split('\n').map((line) => line.trim()).filter(Boolean).slice(0, 8).join('\n')
              const headlineProfessions = detectMentionedProfessions(headline)
              if (headlineProfessions.length) return headlineProfessions
            }
            return current
          }

          """, 'quality profession repair')
          text = replace_between(text, 'function explicitLocation(', 'function approximateExperience(', """function explicitLocation(text: string): string | null {
            return extractCandidateLocationField(text)
          }

          function countryFromLocation(value: string | null): { code: string; name: string } | null {
            if (!value) return null
            const code = resolveSharedCountryFromText(value)
            return code ? { code, name: cleanToken(value) } : null
          }

          function cityFromLocation(value: string | null, country: { code: string; name: string } | null): string | null {
            if (!value || !country) return null
            const cleaned = cleanToken(value)
            if (!cleaned) return null
            const known = detectLexiconCity(cleaned, country.code)
            if (known) return known
            const first = cleanToken(cleaned.split(',')[0] || '')
            if (!first || normalizeHiringCountry(first)) return null
            if (/^(?:europe|europa|європа|европа|штати|states)$/iu.test(first)) return null
            return first.slice(0, 80)
          }

          """, 'quality geography')
          text = replace_once(text, '  const remoteSignal = explicitRemote(text)', '  const remoteSignal = detectCandidateRemotePreference(text)', 'quality remote call')
          text = replace_once(text, "if (!detectedCity && COUNTRY_ALIASES.some((item) => item.re.test(currentCity))) city = null", 'if (!detectedCity && normalizeHiringCountry(currentCity)) city = null', 'quality legacy city cleanup')
          path.write_text(text)

          path = Path('shared/hiringProfessionLabels.ts')
          text = path.read_text()
          text = "import { normalizeSourceRole } from '@whiteslove/parsing-lexicon/hiring-source-aliases'\n\n" + text
          text = replace_between(text, 'const RAW_PROFESSION_LABELS:', 'export function hiringProfessionLabel(', '', 'raw profession labels')
          old_fn = """export function hiringProfessionLabel(value: string, locale: HiringProfessionLocale): string {
            const key = String(value || '').trim()
            const canonical = HIRING_PROFESSION_LABELS[key]
            if (canonical) return canonical[locale]

            for (const alias of RAW_PROFESSION_LABELS) {
              if (!alias.re.test(key)) continue
              if (alias.key) return HIRING_PROFESSION_LABELS[alias.key]?.[locale] || alias.key
              return alias[locale] || key
            }
            return key
          }
          """
          new_fn = """export function hiringProfessionLabel(value: string, locale: HiringProfessionLocale): string {
            const key = String(value || '').trim()
            const canonical = HIRING_PROFESSION_LABELS[key]
            if (canonical) return canonical[locale]
            const normalized = normalizeSourceRole(key)
            if (!normalized) return key
            return HIRING_PROFESSION_LABELS[normalized.label]?.[locale] || normalized.label
          }
          """
          text = replace_once(text, old_fn, new_fn, 'profession label function')
          path.write_text(text)

          path = Path('server/utils/hiringCandidatePresentation.ts')
          text = path.read_text()
          text = replace_once(text, "import { parseExtendedLanguageContext } from '@whiteslove/parsing-lexicon/hiring-language-extensions'\n", """import { parseExtendedLanguageContext } from '@whiteslove/parsing-lexicon/hiring-language-extensions'
          import { normalizeSourceRole } from '@whiteslove/parsing-lexicon/hiring-source-aliases'
          """, 'presentation import')
          text = replace_between(text, 'const STANDALONE_REMOTE_ROLE_RE =', 'const LANGUAGE_LABELS_RU:', """export function publicCandidateProfessionKeys(profile: CvProfile): string[] {
            if (normalizeSourceRole(profile.role)?.label === 'Any Role') return ['Any Role']
            return coreProfessionKeys(profile)
          }

          """, 'presentation role semantics')
          path.write_text(text)
          PY

      - name: Refresh dependency lock
        run: npm install --ignore-scripts

      - name: Run full test suite
        run: npm test

      - name: Verify lexicon boundary
        shell: bash
        run: |
          grep -q 'e18bc9abe2cb5ad6d199e5a7281d2bcf52f79da2' package-lock.json
          test "$(wc -l < shared/jobSkills.ts)" -lt 30
          ! grep -q 'const SPECIAL_PROFESSIONS' server/utils/hiringQuality.ts
          ! grep -q 'const COUNTRY_ALIASES' server/utils/hiringQuality.ts
          ! grep -q 'const RAW_PROFESSION_LABELS' shared/hiringProfessionLabels.ts
          ! grep -q 'const STANDALONE_REMOTE_ROLE_RE' server/utils/hiringCandidatePresentation.ts
          ! grep -q 'const REMOTE_POSITIVE_RE' server/utils/hiringNormalize.ts
          ! grep -q 'const REMOTE_NEGATIVE_RE' server/utils/hiringNormalize.ts
          ! grep -q 'const FLEXIBLE_ROLE_RE' server/utils/hiringNormalize.ts
          ! grep -q 'const NON_ROLE_RE' server/utils/hiringNormalize.ts
          ! grep -q '\\bprincipal\\b' shared/jobs/jobSeniority.ts

      - name: Commit validated cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-shared-lexicon-cleanup.yml
          git add package.json package-lock.json shared/jobSkills.ts shared/jobs/jobSeniority.ts shared/hiringProfessionLabels.ts server/utils/hiringLexicon.ts server/utils/hiringNormalize.ts server/utils/hiringQuality.ts server/utils/hiringCandidatePresentation.ts
          git commit -m "refactor: centralize remaining hiring lexicons"
          git push
