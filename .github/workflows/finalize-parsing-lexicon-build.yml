name: Finalize parsing lexicon integration

on:
  push:
    paths:
      - .github/workflows/finalize-parsing-lexicon-build.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update stale home backdrop regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/regressions.test.mjs')
          text = path.read_text()
          old = "  const hero = readFileSync(new URL('../app/components/redesign/HeroSection.vue', import.meta.url), 'utf8')"
          new = "  const home = readFileSync(new URL('../app/pages/index.vue', import.meta.url), 'utf8')"
          if old not in text:
              raise SystemExit('home backdrop test anchor missing')
          text = text.replace(old, new, 1)
          old_assert = '  assert.match(hero, /ocean-page-backdrop variant="ambient"/u)'
          new_assert = '  assert.match(home, /ocean-page-backdrop variant="ambient"/u)'
          if old_assert not in text:
              raise SystemExit('home backdrop assertion anchor missing')
          text = text.replace(old_assert, new_assert, 1)
          path.write_text(text)
          PY
      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit integration cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json tests/regressions.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: finalize parsing lexicon integration"
          git push
