name: Verify Ukraine jobs feature branch

on:
  push:
    branches: [ fix/ua-jobs-search-expansion ]
    paths:
      - .github/workflows/sync-feature-lock.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ua-jobs-search-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check ingestion syntax
        run: |
          node --experimental-transform-types --check jobs-worker/worker.ts
          node --experimental-transform-types --check server/utils/ukraineJobSources.ts
          node --experimental-transform-types --check server/utils/jobsUaSource.ts
          python -m py_compile job-browser-fetcher/app.py
      - run: npm test
      - run: npm run build
