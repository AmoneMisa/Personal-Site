name: Verify Ukraine jobs feature branch

on:
  push:
    branches: [ fix/ua-jobs-search-expansion ]
    paths:
      - .github/workflows/sync-feature-lock.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ua-jobs-search-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-transform-types --check jobs-worker/worker.ts
      - run: npm test
      - run: npm run build
