name: Verify Flat Finder transport fields

on:
  push:
    branches:
      - feat/flat-transport-fields

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flat-transport-fields
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
          npm run build
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/verify-flat-transport-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(flats): verify transport fields'
          git push origin HEAD:feat/flat-transport-fields
