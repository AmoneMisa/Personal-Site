name: Apply grouped search filters

on:
  push:
    branches:
      - fix/grouped-search-filters
    paths:
      - .tmp/apply_grouped_filters.py
      - .github/workflows/temp-apply-grouped-filters.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/grouped-search-filters
          fetch-depth: 0
      - name: Apply grouped filter UI
        run: python .tmp/apply_grouped_filters.py
      - name: Remove temporary patcher
        run: |
          rm -f .tmp/apply_grouped_filters.py
          rm -f .github/workflows/temp-apply-grouped-filters.yml
          rmdir .tmp 2>/dev/null || true
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Group job and candidate filters"
          git push origin HEAD:fix/grouped-search-filters
