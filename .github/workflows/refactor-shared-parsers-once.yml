name: Refactor shared parsers once

on:
  push:
    branches: [refactor/shared-contact-money-context]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-contact-money-context
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wire country-aware candidate contacts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/utils/hiringNormalize.ts')
          s = p.read_text()
          old = "export function extractContacts(text: string): { telegram?: string; email?: string; phone?: string } {\n  return { ...extractCandidateContacts(text) }\n}"
          new = "export function extractContacts(\n  text: string,\n  country = '',\n): { telegram?: string; email?: string; phone?: string } {\n  return { ...extractCandidateContacts(text, country) }\n}"
          if old not in s:
              raise SystemExit('extractContacts signature block not found')
          s = s.replace(old, new, 1)
          old_call = '  const extractedContacts = extractContacts(text)'
          new_call = "  const extractedContacts = extractContacts(text, profile.country || profile.sourceCountry || '')"
          if old_call not in s:
              raise SystemExit('extractContacts call not found')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s)
          PY
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refactor-shared-parsers-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/utils/hiringNormalize.ts package-lock.json .github/workflows/refactor-shared-parsers-once.yml
          git commit -m "Wire shared parsers into candidate normalization"
          git push origin HEAD:refactor/shared-contact-money-context
