name: Refactor shared work semantics once

on:
  push:
    branches: [refactor/shared-work-semantics]
    paths:
      - '.github/workflows/refactor-shared-work-semantics-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-work-semantics
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Replace MUK country dictionary with shared geography
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/utils/sourceExpansionJobs.ts')
          text = path.read_text()
          old_import = "import { detectHiringLocationName } from '@whiteslove/parsing-lexicon/hiring-location-fields'\n"
          new_import = (
              "import { detectCountryCodeFromText } from '@whiteslove/parsing-lexicon/geography-detection'\n"
              "import { geographyDisplayName } from '@whiteslove/parsing-lexicon/geography-display'\n"
              + old_import
          )
          if old_import not in text:
              raise SystemExit('expected hiring location import not found')
          text = text.replace(old_import, new_import, 1)
          old = """const MUK_COUNTRIES: Array<[RegExp, string, string]> = [
            [/^Узбекистан\\s+/iu, 'Uzbekistan', 'UZ'],
            [/^Казахстан\\s+/iu, 'Kazakhstan', 'KZ'],
            [/^Кыргызстан\\s+/iu, 'Kyrgyzstan', 'KG'],
            [/^Украина\\s+/iu, 'Ukraine', 'UA'],
            [/^Румыния\\s+/iu, 'Romania', 'RO'],
          ]

          """
          if old not in text:
              raise SystemExit('MUK_COUNTRIES block not found')
          text = text.replace(old, '', 1)
          old_parse = """    const country = MUK_COUNTRIES.find(([re]) => re.test(raw))
              if (!country) continue
              const title = raw.replace(country[0], '').trim()
              if (title.length < 3) continue
              out.push(makeJob({
                label: 'MUK',
                title,
                company: 'MUK',
                location: country[1],
                url: absoluteUrl(match[1]!, url),
                description: raw,
                tags: [country[2]],
                employerType: 'direct',
              }))
          """
          new_parse = """    const countryCode = detectCountryCodeFromText(raw)
              if (!countryCode) continue
              // MUK prefixes each card title with one country label; the label semantics
              // come from parsing-lexicon, while removing the source-specific first field stays local.
              const title = raw.replace(/^\\S+\\s+/u, '').trim()
              if (title.length < 3) continue
              out.push(makeJob({
                label: 'MUK',
                title,
                company: 'MUK',
                location: geographyDisplayName(countryCode, 'en', 'country'),
                url: absoluteUrl(match[1]!, url),
                description: raw,
                tags: [countryCode],
                employerType: 'direct',
              }))
          """
          if old_parse not in text:
              raise SystemExit('MUK parser block not found')
          text = text.replace(old_parse, new_parse, 1)
          path.write_text(text)
          PY
      - name: Pin shared parser revision
        run: |
          npm pkg set 'dependencies.@whiteslove/parsing-lexicon=https://github.com/AmoneMisa/parsing-lexicon/archive/d71a2f277f9cf7208da3cba6fbc30748b02749d7.tar.gz'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refactor-shared-work-semantics-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/utils/sourceExpansionJobs.ts package.json package-lock.json .github/workflows/refactor-shared-work-semantics-once.yml
          git commit -m 'Use shared work and country semantics'
          git push origin HEAD:refactor/shared-work-semantics
