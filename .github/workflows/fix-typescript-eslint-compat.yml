name: Fix TypeScript ESLint compatibility

on:
  push:
    branches:
      - refactor/site-wide-technical-debt
    paths:
      - .github/workflows/fix-typescript-eslint-compat.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/site-wide-technical-debt
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin supported TypeScript
        run: npm install --save-dev --save-exact typescript@6.0.3 --no-audit --no-fund

      - name: Verify application
        run: |
          npm run audit:code >/dev/null
          npm run lint -- --quiet
          npm test
          npm run build
          touch db.env
          docker compose config >/dev/null

      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes to commit"
            exit 0
          fi
          git commit -m "fix: pin TypeScript for ESLint compatibility"
          git push origin HEAD:refactor/site-wide-technical-debt
