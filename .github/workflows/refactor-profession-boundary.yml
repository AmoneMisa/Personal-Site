name: Refactor profession boundary

on:
  push:
    branches:
      - refactor/site-wide-technical-debt
    paths:
      - .github/workflows/refactor-profession-boundary.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/site-wide-technical-debt
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update parsing lexicon and remove local profession display semantics
        shell: bash
        run: |
          set -euo pipefail
          npm install @whiteslove/parsing-lexicon@0.5.5 --save-exact
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('server/utils/hiringNormalize.ts')
          source = path.read_text()

          import_anchor = "import { canonicalSkillName, extractSkillDetails } from '~~/shared/jobSkills'"
          profession_import = "import { professionCanonicalDisplayName } from '@whiteslove/parsing-lexicon/hiring-profession-display'"
          if profession_import not in source:
              if import_anchor not in source:
                  raise SystemExit('hiringNormalize import anchor not found')
              source = source.replace(import_anchor, f"{profession_import}\n{import_anchor}", 1)

          source, count = re.subn(
              r"\nconst PROFESSION_ACRONYMS = new Map<string, string>\(\[.*?\n\}\n\nfunction collectProfessions",
              "\nfunction collectProfessions",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected to remove one local profession formatter block, removed {count}')

          old_collect = "detectProfessionMatches(source, 16).map((match) => formatProfessionCanonical(match.canonical)),"
          new_collect = "detectProfessionMatches(source, 16)\n      .map((match) => professionCanonicalDisplayName(match.canonical))\n      .filter(Boolean),"
          if old_collect not in source:
              raise SystemExit('collectProfessions formatter call not found')
          source = source.replace(old_collect, new_collect, 1)

          old_desired = "if (desired) return [formatProfessionCanonical(desired)]"
          new_desired = "if (desired) return [professionCanonicalDisplayName(desired) || desired]"
          if old_desired not in source:
              raise SystemExit('desired profession formatter call not found')
          source = source.replace(old_desired, new_desired, 1)

          if 'PROFESSION_ACRONYMS' in source or 'formatProfessionCanonical' in source:
              raise SystemExit('local profession display semantics remain in hiringNormalize')
          path.write_text(source)

          tests_path = Path('tests/regressions.test.mjs')
          tests = tests_path.read_text()
          marker = "profession display semantics stay in parsing-lexicon"
          if marker not in tests:
              tests += r'''

          test('profession display semantics stay in parsing-lexicon', () => {
            const source = readFileSync(new URL('../server/utils/hiringNormalize.ts', import.meta.url), 'utf8')
            assert.match(source, /@whiteslove\/parsing-lexicon\/hiring-profession-display/)
            assert.doesNotMatch(source, /\bPROFESSION_ACRONYMS\b/)
            assert.doesNotMatch(source, /\bformatProfessionCanonical\b/)
          })
          '''
              tests_path.write_text(tests)
          PY

      - name: Verify
        run: |
          npx nuxt prepare
          npm run lint
          npm test
          npm run build

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server/utils/hiringNormalize.ts tests/regressions.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: move profession display semantics to lexicon"
          git push origin HEAD:refactor/site-wide-technical-debt
