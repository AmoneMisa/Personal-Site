name: Finalize hiring localization v2

on:
  push:
    branches: [ fix/hiring-localization-normalization-v2 ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final hiring fixes
        run: python .github/patches/finalize-hiring-localization-v2.py
      - name: Commit final hiring fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(hiring): finalize localization and normalization'
          git push origin HEAD:fix/hiring-localization-normalization-v2
