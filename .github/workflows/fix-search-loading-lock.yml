name: One-time search loading lock refactor

on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/fix-search-loading-lock.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move shared loader over all interactive search UI
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          # Shared component: inert is the real interaction lock; aria-disabled
          # exposes the state; the overlay must also sit above all local controls.
          path = Path('app/components/ui/ResultsLoader.vue')
          text = path.read_text()
          text = text.replace(
              '<div class="results-loader__content" :inert="loading || undefined">',
              '<div class="results-loader__content" :inert="loading || undefined" :aria-disabled="loading || undefined">',
          )
          text = text.replace('  z-index: 50;\n', '  z-index: 1000;\n')
          if '  cursor: wait;\n' not in text:
              text = text.replace('  pointer-events: auto;\n}\n\n.results-loader__spinner', '  pointer-events: auto;\n  cursor: wait;\n}\n\n.results-loader__spinner')
          path.write_text(text)

          def strip_loader(text: str) -> str:
              text = re.sub(r'\n?\s*<UiResultsLoader\b[^>]*>\s*\n?', '\n', text)
              text = re.sub(r'\n?\s*</UiResultsLoader>\s*\n?', '\n', text)
              return text

          def remove_button_loading(text: str) -> str:
              text = text.replace(' :loading="loading" icon="i-lucide-search"', ' icon="i-lucide-search"')
              text = text.replace('{{ loading ? t("searching") : t("search") }}', '{{ t("search") }}')
              return text

          # Jobs: ATS + all filters + stats + recently viewed + cards + pagination.
          path = Path('app/pages/jobs/index.vue')
          text = strip_loader(path.read_text())
          marker = '    <!-- ATS CV panel -->'
          if text.count(marker) != 1:
              raise SystemExit('jobs: ATS marker mismatch')
          text = text.replace(marker, '    <UiResultsLoader :loading="loading && savedView === \'active\'" :label="t(\'searching\')" min-height="420px">\n' + marker, 1)
          marker = '    <!-- Full vacancy popup -->'
          if text.count(marker) != 1:
              raise SystemExit('jobs: modal marker mismatch')
          text = text.replace(marker, '    </UiResultsLoader>\n\n' + marker, 1)
          text = remove_button_loading(text)
          path.write_text(text)

          # Flat Finder: filters through empty state. Modal/lightbox stay outside.
          path = Path('app/pages/flat-finder/index.vue')
          text = strip_loader(path.read_text())
          marker = '    <form ref="filtersEl" class="flats__controls flats__controls_redesign" @submit.prevent="load()">'
          if text.count(marker) != 1:
              raise SystemExit('flat: form marker mismatch')
          text = text.replace(marker, '    <UiResultsLoader :loading="loading" :label="t(\'searching\')" min-height="420px">\n' + marker, 1)
          marker = '    <u-modal v-model:open="modalOpen"'
          if text.count(marker) != 1:
              raise SystemExit('flat: modal marker mismatch')
          text = text.replace(marker, '    </UiResultsLoader>\n\n' + marker, 1)
          text = remove_button_loading(text)
          path.write_text(text)

          # Hiring: same single-wrapper contract.
          path = Path('app/pages/hiring/index.vue')
          text = strip_loader(path.read_text())
          marker = '    <form class="hiring__controls" @submit.prevent="load()">'
          if text.count(marker) != 1:
              raise SystemExit('hiring: form marker mismatch')
          text = text.replace(marker, '    <UiResultsLoader :loading="loading" :label="t(\'searching\')" min-height="420px">\n' + marker, 1)
          marker = '    <u-modal v-model:open="modalOpen"'
          if text.count(marker) != 1:
              raise SystemExit('hiring: modal marker mismatch')
          text = text.replace(marker, '    </UiResultsLoader>\n\n' + marker, 1)
          text = remove_button_loading(text)
          path.write_text(text)

          for p in [Path('app/pages/jobs/index.vue'), Path('app/pages/flat-finder/index.vue'), Path('app/pages/hiring/index.vue')]:
              body = p.read_text()
              if body.count('<UiResultsLoader') != 1 or body.count('</UiResultsLoader>') != 1:
                  raise SystemExit(f'{p}: expected exactly one shared loader')
              if ':loading="loading" icon="i-lucide-search"' in body:
                  raise SystemExit(f'{p}: duplicate search-button spinner remains')
              if '{{ loading ? t("searching") : t("search") }}' in body:
                  raise SystemExit(f'{p}: loading text remains on search button')
          PY

      - name: Validate application
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit refactor and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-search-loading-lock.yml
          git add app/components/ui/ResultsLoader.vue app/pages/jobs/index.vue app/pages/flat-finder/index.vue app/pages/hiring/index.vue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: lock all search UI behind shared loader"
          git pull --rebase origin master
          git push origin HEAD:master
