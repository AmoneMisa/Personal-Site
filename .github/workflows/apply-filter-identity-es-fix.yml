name: Apply filter identity and ES relevance fixes

on:
  push:
    branches:
      - fix/filter-identity-es-relevance
    paths:
      - .github/workflows/apply-filter-identity-es-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/filter-identity-es-relevance

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          flat_path = Path("app/pages/flat-finder/index.vue")
          flat = flat_path.read_text(encoding="utf-8")

          flat = replace_once(
              flat,
              'const drawnArea = ref<Array<{ lat: number; lng: number }>>([]);\nconst filtersEl = ref<HTMLElement | null>(null);',
              'const drawnArea = ref<Array<{ lat: number; lng: number }>>([]);\nconst mapResetKey = ref(0);\nconst filtersEl = ref<HTMLElement | null>(null);',
              "map reset key",
          )

          flat = replace_once(
              flat,
              '''const hiddenIds = computed(() => new Set(hidden.value.map((item) => item.id)));
const favoriteIds = computed(() => new Set(favorites.value.map((item) => item.id)));
const isHidden = (id: string) => hiddenIds.value.has(id);
const isFavorite = (id: string) => favoriteIds.value.has(id);
''',
              '''function listingKey(listing: Pick<Listing, "source" | "country" | "id">): string {
  return `${String(listing.source || "").toLowerCase()}:${String(listing.country || "").toUpperCase()}:${String(listing.id)}`;
}

function listingMatchesRef(listing: Listing, id: string, sourceName = "", countryCode = ""): boolean {
  if (String(listing.id) !== String(id)) return false;
  if (sourceName && listing.source.toLowerCase() !== sourceName.toLowerCase()) return false;
  if (countryCode && listing.country.toUpperCase() !== countryCode.toUpperCase()) return false;
  return true;
}

const hiddenKeys = computed(() => new Set(hidden.value.map(listingKey)));
const favoriteKeys = computed(() => new Set(favorites.value.map(listingKey)));
const isHidden = (listing: Listing) => hiddenKeys.value.has(listingKey(listing));
const isFavorite = (listing: Listing) => favoriteKeys.value.has(listingKey(listing));
''',
              "composite identity helpers",
          )

          flat = replace_once(
              flat,
              'const activeListings = computed(() => applyDrawnArea(listings.value.filter((item) => !hiddenIds.value.has(item.id))));',
              'const activeListings = computed(() => applyDrawnArea(listings.value.filter((item) => !hiddenKeys.value.has(listingKey(item)))));',
              "active hidden filter",
          )

          flat = replace_once(
              flat,
              '''function resetFilters() {
  city.value = ""; district.value = ""; metro.value = ""; propertyType.value = "any"; dealType.value = "any"; agency.value = "any"; audience.value = "any";
  petFriendly.value = false; roomOnlyFilter.value = false; childrenRequired.value = false; newBuildingOnly.value = false;
  priceMin.value = undefined; priceMax.value = undefined; roomsMin.value = undefined; roomsMax.value = undefined;
  bedroomsMin.value = undefined; bedroomsMax.value = undefined; areaMin.value = undefined; areaMax.value = undefined;
  floorMin.value = undefined; floorMax.value = undefined; totalFloorsMin.value = undefined; totalFloorsMax.value = undefined;
  yearMin.value = undefined; yearMax.value = undefined; maxAgeDays.value = undefined; query.value = "";
  scheduleLoad(80);
}
''',
              '''function resetFilters() {
  countries.value = meta.value.map((item) => item.code);
  source.value = "";
  displayCurrency.value = "USD";
  view.value = "active";
  drawnArea.value = [];
  mapResetKey.value += 1;
  city.value = ""; district.value = ""; metro.value = ""; propertyType.value = "any"; dealType.value = "any"; agency.value = "any"; audience.value = "any";
  petFriendly.value = false; roomOnlyFilter.value = false; childrenRequired.value = false; newBuildingOnly.value = false;
  priceMin.value = undefined; priceMax.value = undefined; roomsMin.value = undefined; roomsMax.value = undefined;
  bedroomsMin.value = undefined; bedroomsMax.value = undefined; areaMin.value = undefined; areaMax.value = undefined;
  floorMin.value = undefined; floorMax.value = undefined; totalFloorsMin.value = undefined; totalFloorsMax.value = undefined;
  yearMin.value = undefined; yearMax.value = undefined; maxAgeDays.value = undefined; query.value = "";
  scheduleLoad(80);
}
''',
              "complete reset",
          )

          flat = replace_once(
              flat,
              '''function toggleFavorite(item: Listing) {
  favorites.value = isFavorite(item.id)
    ? favorites.value.filter((saved) => saved.id !== item.id)
    : [item, ...favorites.value.filter((saved) => saved.id !== item.id)].slice(0, MAX_SAVED_FLATS);
  if (isHidden(item.id)) {
    hidden.value = hidden.value.filter((saved) => saved.id !== item.id);
    persistList(STORAGE.hidden, hidden.value);
  }
  persistList(STORAGE.favorites, favorites.value);
}

function toggleHidden(item: Listing) {
  hidden.value = isHidden(item.id)
    ? hidden.value.filter((saved) => saved.id !== item.id)
    : [item, ...hidden.value.filter((saved) => saved.id !== item.id)].slice(0, MAX_SAVED_FLATS);
  if (isFavorite(item.id)) {
    favorites.value = favorites.value.filter((saved) => saved.id !== item.id);
    persistList(STORAGE.favorites, favorites.value);
  }
  persistList(STORAGE.hidden, hidden.value);
}
''',
              '''function toggleFavorite(item: Listing) {
  const key = listingKey(item);
  favorites.value = isFavorite(item)
    ? favorites.value.filter((saved) => listingKey(saved) !== key)
    : [item, ...favorites.value.filter((saved) => listingKey(saved) !== key)].slice(0, MAX_SAVED_FLATS);
  if (isHidden(item)) {
    hidden.value = hidden.value.filter((saved) => listingKey(saved) !== key);
    persistList(STORAGE.hidden, hidden.value);
  }
  persistList(STORAGE.favorites, favorites.value);
}

function toggleHidden(item: Listing) {
  const key = listingKey(item);
  hidden.value = isHidden(item)
    ? hidden.value.filter((saved) => listingKey(saved) !== key)
    : [item, ...hidden.value.filter((saved) => listingKey(saved) !== key)].slice(0, MAX_SAVED_FLATS);
  if (isFavorite(item)) {
    favorites.value = favorites.value.filter((saved) => listingKey(saved) !== key);
    persistList(STORAGE.favorites, favorites.value);
  }
  persistList(STORAGE.hidden, hidden.value);
}
''',
              "favorite hidden toggles",
          )

          flat = replace_once(flat, '      id: l.id,', '      id: listingKey(l),', "map composite id")
          flat = replace_once(flat, '  return `${listing.id}:${targetLanguage}`;', '  return `${listingKey(listing)}:${targetLanguage}`;', "translation cache identity")
          flat = replace_once(
              flat,
              '  recent.value = [l, ...recent.value.filter((item) => item.id !== l.id)].slice(0, MAX_RECENT_FLATS);',
              '  const key = listingKey(l);\n  recent.value = [l, ...recent.value.filter((item) => listingKey(item) !== key)].slice(0, MAX_RECENT_FLATS);',
              "recent composite identity",
          )

          flat = flat.replace('active.value?.id !== listing.id', '!active.value || listingKey(active.value) !== listingKey(listing)')

          flat = replace_once(
              flat,
              '''function openById(id: string) {
  const found = displayedListings.value.find((l) => l.id === id);
  if (found) openListing(found);
}
''',
              '''function openById(key: string) {
  const found = displayedListings.value.find((listing) => listingKey(listing) === key);
  if (found) openListing(found);
}
''',
              "map open composite identity",
          )

          flat = replace_once(
              flat,
              '  const local = listings.value.find((listing) => listing.id === id);',
              '  const local = listings.value.find((listing) => listingMatchesRef(listing, id, sourceName, countryCode));',
              "shared local exact lookup",
          )
          flat = replace_once(
              flat,
              '  const exact = data?.listings?.find((listing) => listing.id === id);',
              '  const exact = data?.listings?.find((listing) => listingMatchesRef(listing, id, sourceName, countryCode));',
              "shared fetched exact lookup",
          )

          for old, new in [
              (':key="l.id"', ':key="listingKey(l)"'),
              ('isFavorite(l.id)', 'isFavorite(l)'),
              ('isHidden(l.id)', 'isHidden(l)'),
              ('isFavorite(active.id)', 'isFavorite(active)'),
              ('isHidden(active.id)', 'isHidden(active)'),
          ]:
              flat = flat.replace(old, new)

          flat = replace_once(
              flat,
              '      <flat-map\n          :points="mapPoints"',
              '      <flat-map\n          :key="mapResetKey"\n          :points="mapPoints"',
              "map reset remount",
          )

          flat_path.write_text(flat, encoding="utf-8")

          types_path = Path("server/utils/jobTypes.ts")
          types = types_path.read_text(encoding="utf-8")
          types = replace_once(
              types,
              '  sort: SortKey\n  maxAgeDays: number',
              '  sort: SortKey\n  preserveOrder?: boolean // keep upstream Elasticsearch relevance order\n  maxAgeDays: number',
              "job query preserve order",
          )
          types_path.write_text(types, encoding="utf-8")

          aggregate_path = Path("server/utils/aggregate.ts")
          aggregate = aggregate_path.read_text(encoding="utf-8")
          aggregate = replace_once(
              aggregate,
              '  filtered.sort(comparators[query.sort] || comparators.date)\n',
              '  if (!query.preserveOrder) filtered.sort(comparators[query.sort] || comparators.date)\n',
              "aggregate preserve order",
          )
          aggregate_path.write_text(aggregate, encoding="utf-8")

          feed_path = Path("server/routes/jobs-feed.get.ts")
          feed = feed_path.read_text(encoding="utf-8")
          feed = replace_once(
              feed,
              '''  const searchPool =
      searchMatches
          ? pool.filter(
              (job) =>
                  searchMatches!
                      .rank
                      .has(
                          jobSearchKey(
                              job,
                          ),
                      ),
          )
          : pool;
''',
              '''  const searchPool = searchMatches
      ? pool
          .filter((job) => searchMatches!.rank.has(jobSearchKey(job)))
          .sort((a, b) =>
            (searchMatches!.rank.get(jobSearchKey(a)) ?? Number.MAX_SAFE_INTEGER)
            - (searchMatches!.rank.get(jobSearchKey(b)) ?? Number.MAX_SAFE_INTEGER),
          )
      : pool;
''',
              "ranked ES pool",
          )
          feed = replace_once(
              feed,
              '''      sort,
      maxAgeDays: clampInt(q.maxAgeDays, 14, 1, 14),
''',
              '''      sort,
      // The UI's default `date` sort means "best default" during a text search.
      // Preserve Elasticsearch _score/rank in that case. Any explicit non-date
      // sort (oldest/title/company/salary) still overrides relevance normally.
      preserveOrder: !!searchMatches && sort === 'date',
      maxAgeDays: clampInt(q.maxAgeDays, 14, 1, 14),
''',
              "preserve ES rank flag",
          )
          feed_path.write_text(feed, encoding="utf-8")

      - name: Sanity-check patched references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function listingKey' app/pages/flat-finder/index.vue
          grep -q 'preserveOrder: !!searchMatches' server/routes/jobs-feed.get.ts
          grep -q 'if (!query.preserveOrder)' server/utils/aggregate.ts
          ! grep -q 'isFavorite(l.id)' app/pages/flat-finder/index.vue
          ! grep -q 'isHidden(l.id)' app/pages/flat-finder/index.vue

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/pages/flat-finder/index.vue server/routes/jobs-feed.get.ts server/utils/aggregate.ts server/utils/jobTypes.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reset flat filters, use composite ids, preserve ES relevance'
          git push origin HEAD:fix/filter-identity-es-relevance
