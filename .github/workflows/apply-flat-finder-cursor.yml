name: Apply Flat Finder cursor pagination

on:
  push:
    branches: [ perf/flat-finder-cursor-pagination ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply cursor patch
        run: python .github/patches/apply-flat-finder-cursor.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Nuxt application
        run: npm run build
      - name: Verify cursor wiring
        run: |
          grep -q 'nextCursor' app/pages/flat-finder/index.vue
          grep -q 'params.cursor' app/pages/flat-finder/index.vue
      - name: Commit applied cursor pagination
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/pages/flat-finder/index.vue
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'perf: use cursor pagination for Flat Finder'
            git push origin HEAD:perf/flat-finder-cursor-pagination
          fi
