name: One-shot geo dependency sync

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/dependency-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Regenerate package lock with released geo packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund '@whiteslove/geo-catalog@^0.9.1' '@whiteslove/parsing-lexicon@^0.6.15'
      - name: Commit generated manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependency manifests already current.'
            exit 0
          fi
          git commit -m 'chore: update geo dependencies'
          git push origin HEAD:develop
