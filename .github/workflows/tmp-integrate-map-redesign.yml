name: Temporary map redesign integration

on:
  push:
    branches:
      - integrate-map-redesign

permissions:
  contents: write

concurrency:
  group: map-redesign-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch redesign source branch
        run: git fetch origin develop master
      - name: Integrate redesign onto current master
        run: |
          python scripts/integrate_map_redesign_master.py
          python scripts/fix_integrated_map_master.py
          python scripts/fix_integrated_map_types.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tests
        run: npm test
      - name: Verify changed map types
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/typecheck.log
          if grep -E 'app/components/flats/FlatMap\.client\.vue|app/pages/flat-finder/index\.vue|shared/contracts/flatGeo\.ts|app/composables/flats/useGeoCityCatalog\.ts|app/composables/flats/useDistrictZones\.ts|server/routes/flats-geo-city\.get\.ts' /tmp/typecheck.log; then
            echo 'Changed Flat Finder map surface still has type errors.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Repository-wide typecheck still has unrelated baseline errors; changed map surface is clean.'
          fi
      - name: Verify production build
        run: npm run build
      - name: Commit verified integrated sources
        shell: bash
        run: |
          git config user.name "MARHARYTA KUBAI"
          git config user.email "44707323+AmoneMisa@users.noreply.github.com"
          git add \
            app/components/flats/FlatMap.client.vue \
            tests/flat-map-camera-preservation.test.mjs \
            tests/flat-map-interaction-modes.test.mjs \
            tests/flat-map-selection-sync.test.mjs \
            tests/flat-map-responsive-overlays.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated integration changes.'
            exit 0
          fi
          git commit -m "feat(flats): integrate adaptive map redesign onto master"
          git push origin HEAD:integrate-map-redesign
