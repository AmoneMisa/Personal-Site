name: Pin parsing lexicon grouped money fix once

on:
  push:
    branches: [refactor/shared-ishbor-meta-salary]

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ishbor-meta-salary
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin package and refresh lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund @whiteslove/parsing-lexicon@https://github.com/AmoneMisa/parsing-lexicon/archive/03c564716c0c91e908a73fbed4254b57133ed900.tar.gz
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/pin-parsing-lexicon-03c564-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/pin-parsing-lexicon-03c564-once.yml
          git commit -m "Pin grouped money parser fix"
          git push origin HEAD:refactor/shared-ishbor-meta-salary
