name: Validate pull request

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify worker and Compose syntax
        run: |
          node --experimental-transform-types --check jobs-worker/worker.ts
          node --check jobs-worker/alias-loader.mjs
          touch db.env
          docker compose config >/dev/null

      - name: Run application tests
        run: npm test

      - name: Build Nuxt application
        run: npm run build
