name: Normalize Flat Finder geo dependency lock

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/normalize-flat-geo-lock.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Assert geo catalog is not a Personal Site dependency
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          if (pkg.dependencies?.['@whiteslove/geo-catalog']) throw new Error('geo-catalog remains in package.json')
          if (lock.packages?.['']?.dependencies?.['@whiteslove/geo-catalog']) throw new Error('geo-catalog remains in lock root')
          if (lock.packages?.['node_modules/@whiteslove/geo-catalog']) throw new Error('geo-catalog remains in lock packages')
          NODE

      - name: Commit normalized lock and remove one-shot workflow
        run: |
          rm .github/workflows/normalize-flat-geo-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/normalize-flat-geo-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(flats): remove client geo catalog lock entry'
          git push origin HEAD:develop
