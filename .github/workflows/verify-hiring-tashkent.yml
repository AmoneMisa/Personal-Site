name: Verify Tashkent hiring coverage

on:
  push:
    branches: [ fix/ua-jobs-search-expansion ]
    paths:
      - .github/workflows/verify-hiring-tashkent.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ua-jobs-search-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check hiring syntax
        run: |
          node --experimental-transform-types --check server/hiring/sources/socialRefresh.ts
          node --experimental-transform-types --check server/hiring/sources/linkedInRefresh.ts
          node --experimental-transform-types --check shared/hiring/sources/ishBorCrawler.ts
          node --experimental-transform-types --check shared/hiring/sources/telegramChannels.ts
      - run: npm test
      - run: npm run build
      # Branch-local verification only; removed before final PR state.
