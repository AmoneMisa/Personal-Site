name: Refactor shared vacancy context

on:
  push:
    branches:
      - feat/shared-parsing-lexicon
    paths:
      - .github/workflows/refactor-shared-vacancy-context.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-parsing-lexicon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace vacancy contextual lexicon
        run: python .github/scripts/refactor_shared_vacancy_context.py
      - name: Commit phase
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/utils/enrich.ts shared/contracts/jobs.ts
          if git diff --cached --quiet; then
            echo 'No vacancy context changes to commit'
            exit 0
          fi
          git commit -m 'refactor(hiring): use shared vacancy context'
          git push origin HEAD:feat/shared-parsing-lexicon
