name: Tighten flat finder price gap

on:
  push:
    branches: [feat/flat-finder-filter-redesign]

permissions:
  contents: write

jobs:
  tighten-price-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flat-finder-filter-redesign
      - name: Reduce spacing between price inputs
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/pages/flat-finder/index.vue')
          s = p.read_text()

          # Desktop: bring [from] — [to] together without shrinking the fields.
          s = s.replace(
              'grid-template-columns: auto minmax(150px,210px) auto minmax(150px,210px) minmax(130px,150px); align-items: end; gap: 10px;',
              'grid-template-columns: auto minmax(150px,210px) auto minmax(150px,210px) minmax(130px,150px); align-items: end; column-gap: 4px; row-gap: 10px;'
          )

          # Mobile keeps the same compact visual rhythm.
          s = s.replace(
              '.filter-price-row { grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; }',
              '.filter-price-row { grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); column-gap: 4px; row-gap: 8px; }'
          )
          s = s.replace(
              '.filter-price-row { gap: 6px; }',
              '.filter-price-row { column-gap: 3px; row-gap: 6px; }'
          )

          p.write_text(s)
      - name: Commit tighter price spacing
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/pages/flat-finder/index.vue
          git diff --cached --quiet && exit 0
          git commit -m "style: tighten price range spacing"
          git push origin feat/flat-finder-filter-redesign
