name: Fix grouped filter forms
on:
  push:
    branches: [fix/grouped-search-filters]
    paths:
      - .tmp/fix_grouped_filter_forms.py
      - .github/workflows/temp-fix-grouped-filter-forms.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/grouped-search-filters
          fetch-depth: 0
      - run: python .tmp/fix_grouped_filter_forms.py
      - run: |
          rm -f .tmp/fix_grouped_filter_forms.py .github/workflows/temp-fix-grouped-filter-forms.yml
          rmdir .tmp 2>/dev/null || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix grouped filter form markup"
          git push origin HEAD:fix/grouped-search-filters
