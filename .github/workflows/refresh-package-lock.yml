name: Refresh package lock

on:
  push:
    branches:
      - chore/use-published-shared-packages

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/use-published-shared-packages

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Drop stale GitHub package lock entry
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));delete p.packages['node_modules/@whiteslove/parsing-lexicon'];fs.writeFileSync('package-lock.json',JSON.stringify(p,null,2)+'\n')"

      - run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm package lock"
          git push
