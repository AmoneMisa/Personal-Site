name: Verify Flat Finder availability trigger

on:
  push:
    branches: [ feat/flat-availability-checks ]
  pull_request:
    branches: [ master ]
    paths:
      - 'server/routes/flats-feed.get.ts'
      - 'tests/flats-shared-popup.test.mjs'
      - '.github/workflows/flat-availability-branch-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test Flat Finder availability cache behavior
        run: node --test tests/flats-shared-popup.test.mjs
      - name: Build Nuxt app
        run: npm run build
