name: Verify subscription bot

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'subscription-bot/**'
      - 'server/routes/subscription-link.post.ts'
      - 'server/routes/subscription-status.get.ts'
      - 'app/components/TelegramSubscriptionButton.client.vue'
      - 'docker-compose.yml'
      - '.github/workflows/subscription-bot-ci.yml'

permissions:
  contents: read

concurrency:
  group: subscription-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subscription-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: docker build -t personal-site-subscription-bot:test .
