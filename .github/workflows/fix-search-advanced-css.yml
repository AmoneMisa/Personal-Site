name: Verify search advanced filter cleanup

on:
  push:
    branches:
      - refactor/search-advanced-filters-final

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/search-advanced-filters-final
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage parsing lexicon for tests
        run: |
          mkdir -p node_modules/@whiteslove/parsing-lexicon
          curl -fsSL https://github.com/AmoneMisa/parsing-lexicon/archive/2aaafbbc8a064c3d5041f1185eb00f0615891ae2.tar.gz \
            | tar -xz --strip-components=1 -C node_modules/@whiteslove/parsing-lexicon
      - name: Clean legacy CSS remnants
        run: node .github/scripts/fix_search_advanced_css.mjs
      - name: Run focused regression tests
        run: node --experimental-strip-types --import ./tests/setup.mjs --test tests/flats-layout-and-stats.test.mjs tests/hiring-statistics.test.mjs
      - name: Remove one-off verification files
        run: rm .github/scripts/fix_search_advanced_css.mjs .github/workflows/fix-search-advanced-css.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(search): remove legacy advanced filter css remnants"
          git push origin HEAD:refactor/search-advanced-filters-final
