name: Verify complete Flat Finder UI

on:
  push:
    branches: [ feat/flat-filters-complete ]
    paths:
      - .github/workflows/verify-flat-complete-ui.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flat-filters-complete
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and record result
        shell: bash
        run: |
          set +e
          npm run build > /tmp/flat-ui-build.log 2>&1
          status=$?
          { echo "status=$status"; tail -n 80 /tmp/flat-ui-build.log; } > .flat-ui-build-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .flat-ui-build-result.txt
          git commit -m "Record Flat Finder UI build result"
          git push origin HEAD:feat/flat-filters-complete
          exit $status
