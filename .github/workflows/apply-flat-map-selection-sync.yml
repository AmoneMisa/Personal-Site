name: Apply flat map selection sync

on:
  push:
    branches:
      - feature/flat-map-selection-sync-20260830

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[flat-map-sync-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flat-map-selection-sync-20260830
          fetch-depth: 0

      - name: Apply map selection patch
        run: python .github/apply_flat_map_selection_sync.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified changes
        run: |
          rm .github/apply_flat_map_selection_sync.py .github/workflows/apply-flat-map-selection-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(flats): sync map selections with filters [flat-map-sync-applied]"
          git push origin HEAD:feature/flat-map-selection-sync-20260830
