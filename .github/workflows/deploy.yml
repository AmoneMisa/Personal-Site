name: Build and deploy Personal Site

on:
  push:
    branches: [ master ]

concurrency:
  group: personal-site-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/amonemisa/personal-site
  BACKEND_IMAGE: ghcr.io/amonemisa/personal-site-backend
  JOBS_WORKER_IMAGE: ghcr.io/amonemisa/personal-site-jobs-worker
  JOB_BROWSER_FETCHER_IMAGE: ghcr.io/amonemisa/personal-site-job-browser-fetcher
  SUBSCRIPTION_BOT_IMAGE: ghcr.io/amonemisa/personal-site-subscription-bot

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_builds: ${{ steps.detect.outputs.has_builds }}
      frontend: ${{ steps.detect.outputs.frontend }}
      node_verify: ${{ steps.detect.outputs.node_verify }}
      subscription_bot: ${{ steps.detect.outputs.subscription_bot }}
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected verification scope
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="__FULL_BUILD__"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          printf 'Changed files:\n%s\n' "$changed_files"

          matches() {
            local pattern="$1"
            [[ "$changed_files" == "__FULL_BUILD__" ]] || grep -Eq "$pattern" <<<"$changed_files"
          }

          # Production is deployed as one immutable release. Build every runtime
          # image with the same commit SHA so Compose never mixes a new service
          # with a stale/mutable `latest` image from another workflow run.
          frontend=true
          backend=true
          jobs_worker=true
          job_browser_fetcher=true
          subscription_bot=true

          matrix='[]'
          add_service() {
            local name="$1" context="$2" dockerfile="$3" image="$4"
            matrix="$(jq -c \
              --arg name "$name" \
              --arg context "$context" \
              --arg file "$dockerfile" \
              --arg image "$image" \
              '. + [{name:$name,context:$context,file:$file,image:$image}]' <<<"$matrix")"
          }

          add_service frontend . ./Dockerfile "$FRONTEND_IMAGE"
          add_service backend ./backend ./backend/Dockerfile "$BACKEND_IMAGE"
          add_service jobs-worker . ./jobs-worker/Dockerfile "$JOBS_WORKER_IMAGE"
          add_service job-browser-fetcher ./job-browser-fetcher ./job-browser-fetcher/Dockerfile "$JOB_BROWSER_FETCHER_IMAGE"
          add_service subscription-bot ./subscription-bot ./subscription-bot/Dockerfile "$SUBSCRIPTION_BOT_IMAGE"

          node_verify=false
          if matches '^(package(-lock)?\.json|eslint\.config\.mjs|app/|server/|shared/|i18n/|public/|internal/|jobs-worker/|scripts/|subscription-bot/|tests/|nuxt\.config\.ts|tsconfig[^/]*\.json)'; then
            node_verify=true
          fi

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "has_builds=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "node_verify=$node_verify" >> "$GITHUB_OUTPUT"
          echo "subscription_bot=true" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify worker syntax
        if: needs.changes.outputs.node_verify == 'true'
        run: |
          node --experimental-transform-types --check jobs-worker/worker.ts
          node --check jobs-worker/alias-loader.mjs

      - name: Run ESLint
        if: needs.changes.outputs.node_verify == 'true'
        run: npm run lint -- --quiet

      - name: Verify Compose syntax
        run: |
          touch db.env
          docker compose config >/dev/null

      - name: Run application tests
        if: needs.changes.outputs.node_verify == 'true'
        run: npm test

      - name: Verify subscription bot
        working-directory: subscription-bot
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Build Nuxt application
        run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: [changes, verify]
    if: needs.verify.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, verify, build]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.build.result == 'success'
    environment: Production
    steps:
      - name: Deploy immutable release via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            cd ~/opt/myproject

            # Production is a deployment checkout, not a development branch.
            # Always use exactly the source revision whose five images were built.
            if [ -d .git ]; then
              git fetch origin master
              git reset --hard "${{ github.sha }}"
            fi

            FRONTEND_IMAGE_TAG="${{ github.sha }}" \
            BACKEND_IMAGE_TAG="${{ github.sha }}" \
            JOBS_WORKER_IMAGE_TAG="${{ github.sha }}" \
            JOB_BROWSER_FETCHER_IMAGE_TAG="${{ github.sha }}" \
            SUBSCRIPTION_BOT_IMAGE_TAG="${{ github.sha }}" \
            DEPLOY_SHA="${{ github.sha }}" DEPLOY_SOURCE=github \
              flock -w 1800 /tmp/personal-site-deploy.lock bash ./deploy.sh

            export FRONTEND_IMAGE_TAG="${{ github.sha }}"
            export BACKEND_IMAGE_TAG="${{ github.sha }}"
            export JOBS_WORKER_IMAGE_TAG="${{ github.sha }}"
            export JOB_BROWSER_FETCHER_IMAGE_TAG="${{ github.sha }}"
            export SUBSCRIPTION_BOT_IMAGE_TAG="${{ github.sha }}"

            verify_service_image() {
              local service="$1" image="$2"
              local container_id expected_image actual_image
              container_id="$(docker compose --env-file db.env ps -q "$service")"
              test -n "$container_id"
              expected_image="$(docker image inspect "$image:${{ github.sha }}" --format='{{.Id}}')"
              actual_image="$(docker inspect "$container_id" --format='{{.Image}}')"
              test "$actual_image" = "$expected_image"
              echo "Verified $service image for ${{ github.sha }}: $actual_image"
            }

            verify_service_image frontend "$FRONTEND_IMAGE"
            verify_service_image backend "$BACKEND_IMAGE"
            verify_service_image jobs-worker "$JOBS_WORKER_IMAGE"
            verify_service_image job-browser-fetcher "$JOB_BROWSER_FETCHER_IMAGE"
            verify_service_image subscription-bot "$SUBSCRIPTION_BOT_IMAGE"
