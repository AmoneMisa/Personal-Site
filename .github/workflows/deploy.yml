name: Build and deploy Personal Site

on:
  push:
    branches: [ master ]

# Multiple rapid pushes used to build/deploy in parallel and could overlap
# docker compose recreates on the production host. Keep only the newest
# workflow active before deploy; the remote flock below is the final guard
# against overlapping SSH deploy commands.
concurrency:
  group: personal-site-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/amonemisa/personal-site
  BACKEND_IMAGE: ghcr.io/amonemisa/personal-site-backend
  QUEUE_IMAGE: ghcr.io/amonemisa/personal-site-jobs-queue
  JOB_BROWSER_FETCHER_IMAGE: ghcr.io/amonemisa/personal-site-job-browser-fetcher

jobs:
  # Every image is built here rather than on the deployment server. The server
  # can reach ghcr.io but not Docker Hub (auth.docker.io TLS handshake timeouts),
  # so any server-side build that needs a `python:*-slim` base fails outright.
  # Building in CI also keeps the slow Nuxt build off the deploy command timeout.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            file: ./Dockerfile
            image: ghcr.io/amonemisa/personal-site
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/amonemisa/personal-site-backend
          - name: jobs-queue
            context: ./jobs-queue-worker
            file: ./jobs-queue-worker/Dockerfile
            image: ghcr.io/amonemisa/personal-site-jobs-queue
          - name: job-browser-fetcher
            context: ./job-browser-fetcher
            file: ./job-browser-fetcher/Dockerfile
            image: ghcr.io/amonemisa/personal-site-job-browser-fetcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            cd ~/opt/myproject

            # docker-compose.yml is deployment-managed by Git. Older workflows
            # copied it over the checkout before `git pull`, which made the tree
            # dirty and caused pull/deploy to fail. Heal that legacy dirty file
            # once, then update the checkout normally. No SCP overwrite is used.
            if [ -d .git ]; then
              git restore --source=HEAD --staged --worktree -- docker-compose.yml
              git pull --ff-only
            fi

            flock -w 1800 /tmp/personal-site-deploy.lock bash ./deploy.sh
