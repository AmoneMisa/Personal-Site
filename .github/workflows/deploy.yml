name: Build and deploy Personal Site

on:
  push:
    branches: [ master ]

concurrency:
  group: personal-site-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/amonemisa/personal-site
  BACKEND_IMAGE: ghcr.io/amonemisa/personal-site-backend
  JOBS_WORKER_IMAGE: ghcr.io/amonemisa/personal-site-jobs-worker
  JOB_BROWSER_FETCHER_IMAGE: ghcr.io/amonemisa/personal-site-job-browser-fetcher
  SUBSCRIPTION_BOT_IMAGE: ghcr.io/amonemisa/personal-site-subscription-bot

jobs:
  # All runtime images are built in CI. Production only pulls immutable build
  # outputs; it never compiles Nuxt or installs dependencies during deployment.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            file: ./Dockerfile
            image: ghcr.io/amonemisa/personal-site
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/amonemisa/personal-site-backend
          - name: jobs-worker
            context: .
            file: ./jobs-worker/Dockerfile
            image: ghcr.io/amonemisa/personal-site-jobs-worker
          - name: job-browser-fetcher
            context: ./job-browser-fetcher
            file: ./job-browser-fetcher/Dockerfile
            image: ghcr.io/amonemisa/personal-site-job-browser-fetcher
          - name: subscription-bot
            context: ./subscription-bot
            file: ./subscription-bot/Dockerfile
            image: ghcr.io/amonemisa/personal-site-subscription-bot
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            cd ~/opt/myproject

            # docker-compose.yml is deployment-managed by Git. Heal the dirty
            # file left by the retired SCP workflow before updating the checkout.
            if [ -d .git ]; then
              git restore --source=HEAD --staged --worktree -- docker-compose.yml
              git pull --ff-only
            fi

            flock -w 1800 /tmp/personal-site-deploy.lock bash ./deploy.sh
