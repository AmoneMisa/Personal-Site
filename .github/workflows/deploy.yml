name: Build and deploy Personal Site

on:
  push:
    branches: [ master ]

concurrency:
  group: personal-site-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/amonemisa/personal-site
  BACKEND_IMAGE: ghcr.io/amonemisa/personal-site-backend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run code quality inventory
        run: npm run audit:code

      - name: Run ESLint
        run: npm run lint -- --quiet

      - name: Run application tests
        run: npm test

      - name: Build Nuxt application
        run: npm run build

      - name: Verify Compose syntax
        run: |
          touch db.env
          docker compose config >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify Python backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m compileall -q src
          python -m unittest discover -s tests -p 'test_*.py'

  build:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            file: ./Dockerfile
            image: ghcr.io/amonemisa/personal-site
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/amonemisa/personal-site-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: needs.verify.result == 'success' && needs.build.result == 'success'
    environment: Production
    steps:
      - name: Deploy immutable release via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            cd ~/opt/myproject
            if [ -d .git ]; then
              git fetch origin master
              git reset --hard "${{ github.sha }}"
            fi

            FRONTEND_IMAGE_TAG="${{ github.sha }}" \
            BACKEND_IMAGE_TAG="${{ github.sha }}" \
            DEPLOY_SHA="${{ github.sha }}" DEPLOY_SOURCE=github \
              flock -w 1800 /tmp/personal-site-deploy.lock bash ./deploy.sh

            export FRONTEND_IMAGE_TAG="${{ github.sha }}"
            export BACKEND_IMAGE_TAG="${{ github.sha }}"

            verify_service_image() {
              local service="$1" image="$2"
              local container_id expected_image actual_image
              container_id="$(docker compose --env-file db.env ps -q "$service")"
              test -n "$container_id"
              expected_image="$(docker image inspect "$image:${{ github.sha }}" --format='{{.Id}}')"
              actual_image="$(docker inspect "$container_id" --format='{{.Image}}')"
              test "$actual_image" = "$expected_image"
              echo "Verified $service image for ${{ github.sha }}: $actual_image"
            }

            verify_service_image frontend "${{ env.FRONTEND_IMAGE }}"
            verify_service_image backend "${{ env.BACKEND_IMAGE }}"
