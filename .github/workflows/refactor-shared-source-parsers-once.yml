name: Refactor shared source parsers once

on:
  push:
    branches: [refactor/shared-source-contact-money]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-source-contact-money
      - name: Remove source-local contact and money parsers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/hiring/sources/linkedInRefresh.ts')
          s = p.read_text()
          marker = "import type { CvProfile } from '../../utils/hiringTypes'\n"
          if "@whiteslove/parsing-lexicon/hiring-candidate-fields" not in s:
              s = s.replace(marker, marker + "import { extractCandidateContacts } from '@whiteslove/parsing-lexicon/hiring-candidate-fields'\n", 1)
          s, n = re.subn(
              r"function contacts\(text: string\): DirectContacts \{.*?\n\}\n\nfunction roleFrom",
              "function contacts(text: string, country: LinkedInCountry): DirectContacts {\n  return { ...extractCandidateContacts(text, country) }\n}\n\nfunction roleFrom",
              s, count=1, flags=re.S,
          )
          if n != 1: raise SystemExit('linkedIn contacts block not found')
          s = s.replace('const publicContacts = contacts(text)', 'const publicContacts = contacts(text, target.country)', 1)
          p.write_text(s)

          p = Path('server/hiring/sources/secondary/profile.ts')
          s = p.read_text()
          imports = "import { extractCandidateContacts } from '@whiteslove/parsing-lexicon/hiring-candidate-fields'\nimport { parseHiringSourceSalary } from '@whiteslove/parsing-lexicon/hiring-source-semantics'\n"
          if "parseHiringSourceSalary" not in s:
              s = imports + s
          replacement = '''function parseSalary(text: string, fallback: string): Pick<CvProfile, 'salaryMin' | 'salaryMax' | 'currency'> {
  const parsed = parseHiringSourceSalary(text)
  if (!parsed || (parsed.min == null && parsed.max == null)) return {}
  const first = parsed.min ?? parsed.max
  const second = parsed.max ?? parsed.min
  if (first == null || !Number.isFinite(first) || first <= 0) return {}
  const upper = second != null && Number.isFinite(second) ? second : first
  const currency = parsed.currency || fallback
  if (!currency) return {}
  return {
    salaryMin: Math.min(first, upper),
    salaryMax: Math.max(first, upper),
    currency,
  }
}

function contacts(text: string, country: string): CvProfile['contacts'] {
  return { ...extractCandidateContacts(text, country) }
}

export function parseSecondaryChipSalary(
  chip: string,
): Pick<CvProfile, 'salaryMin' | 'salaryMax' | 'currency'> {
  return parseSalary(chip, '')
}

export function buildSecondaryProfile'''
          s, n = re.subn(
              r"function parseSalary\(text: string, fallback: string\): Pick<CvProfile, 'salaryMin' \| 'salaryMax' \| 'currency'> \{.*?\nexport function buildSecondaryProfile",
              replacement, s, count=1, flags=re.S,
          )
          if n != 1: raise SystemExit('secondary salary/contact block not found')
          s = s.replace('const publicContacts = contacts(input.text)', 'const publicContacts = contacts(input.text, input.country)', 1)
          p.write_text(s)

          p = Path('shared/hiring/webFields.ts')
          s = p.read_text()
          old = "export function contacts(text: string): CvProfile['contacts'] {\n  return { ...extractCandidateContacts(text) }\n}"
          new = "export function contacts(text: string, country = ''): CvProfile['contacts'] {\n  return { ...extractCandidateContacts(text, country) }\n}"
          if old not in s: raise SystemExit('webFields contacts block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('server/hiring/sources/web/common.ts')
          s = p.read_text()
          old = 'const publicContacts = contacts(block.text)'
          if old not in s: raise SystemExit('web common contacts call not found')
          p.write_text(s.replace(old, 'const publicContacts = contacts(block.text, source.country)', 1))

          p = Path('shared/hiring/ishBorProfile.ts')
          s = p.read_text()
          old = 'const publicContacts = { ...extractCandidateContacts(detailText) }'
          if old not in s: raise SystemExit('IshBor contacts call not found')
          p.write_text(s.replace(old, "const publicContacts = { ...extractCandidateContacts(detailText, 'UZ') }", 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refactor-shared-source-parsers-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/hiring/sources/linkedInRefresh.ts server/hiring/sources/secondary/profile.ts shared/hiring/webFields.ts server/hiring/sources/web/common.ts shared/hiring/ishBorProfile.ts .github/workflows/refactor-shared-source-parsers-once.yml
          git commit -m "Use shared parsers across hiring sources"
          git push origin HEAD:refactor/shared-source-contact-money
