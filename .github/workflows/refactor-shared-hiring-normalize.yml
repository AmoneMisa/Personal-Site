name: Refactor shared hiring normalize

on:
  push:
    branches:
      - feat/shared-parsing-lexicon
    paths:
      - .github/workflows/refactor-shared-hiring-normalize.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-parsing-lexicon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove stale local profession matcher
        run: python .github/scripts/cleanup_shared_hiring_normalize.py
      - name: Commit phase
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/utils/hiringNormalize.ts
          if git diff --cached --quiet; then
            echo 'No hiring normalize cleanup to commit'
            exit 0
          fi
          git commit -m 'fix(hiring): remove stale profession matcher'
          git push origin HEAD:feat/shared-parsing-lexicon
