name: Pin unified geography once

on:
  push:
    branches: [refactor/use-canonical-geography-api]
    paths:
      - '.github/workflows/pin-unified-geography-once.yml'

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/use-canonical-geography-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/pin-unified-geography-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/pin-unified-geography-once.yml
          git commit -m 'Update lockfile for unified geography package'
          git push origin HEAD:refactor/use-canonical-geography-api
