name: One-time results loader refactor

on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/refactor-results-loader.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor search pages to shared loader
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          component = Path("app/components/ui/ResultsLoader.vue")
          if not component.exists():
              raise SystemExit("shared UiResultsLoader component is missing")

          # Jobs: one wrapper owns both Recently viewed and the vacancy grid, so
          # every stale interactive result is inert while a foreground load runs.
          path = Path("app/pages/jobs/index.vue")
          text = path.read_text()
          text = replace_once(
              text,
              '    <p v-else-if="loading && !stats && !jobs.length" class="jobs__count text-muted">{{ t("searching") }}…</p>\n',
              '',
              'jobs initial searching text',
          )
          text = replace_once(
              text,
              '    <!-- Recently viewed (last up to 4) -->\n',
              '    <UiResultsLoader :loading="loading && savedView === \'active\'" :label="t(\'searching\')" min-height="210px">\n    <!-- Recently viewed (last up to 4) -->\n',
              'jobs loader start',
          )
          text = replace_once(
              text,
              '    <div class="jobs__results">\n     <div class="jobs__grid" :class="{ \'jobs__grid_loading\': loading && savedView === \'active\' }">\n',
              '    <div class="jobs__grid">\n',
              'jobs grid wrapper',
          )
          text = replace_once(
              text,
              '     </div>\n     <div v-if="loading" class="jobs__loader" role="status" aria-live="polite">\n       <u-icon name="i-lucide-loader-circle" class="jobs__loader-icon" />\n       <span>{{ t("searching") }}</span>\n     </div>\n    </div>\n',
              '     </div>\n    </UiResultsLoader>\n',
              'jobs loader end',
          )
          text = replace_once(
              text,
              '.jobs__results { position: relative; }\n',
              '',
              'jobs results css',
          )
          text = replace_once(
              text,
              '/* Dim + lock the current results while a new page/filter is loading, and float a\n   spinner over them so it\'s clear the list is refreshing (not empty). */\n.jobs__grid_loading { opacity: 0.35; pointer-events: none; transition: opacity 140ms ease; }\n.jobs__loader {\n  position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center;\n  gap: 10px; padding-top: 72px; color: var(--ui-text-muted); font-weight: 600; z-index: 2;\n}\n.jobs__loader-icon { width: 28px; height: 28px; animation: jobs-spin 0.7s linear infinite; }\n@keyframes jobs-spin { to { transform: rotate(360deg); } }\n',
              '',
              'jobs legacy loader css',
          )
          path.write_text(text)

          # Flat Finder: map and cards are one result surface. Both become inert
          # under the same shared overlay while stale data is being replaced.
          path = Path("app/pages/flat-finder/index.vue")
          text = path.read_text()
          text = replace_once(
              text,
              '    <section v-if="listings.length" class="flats__map-wrap"><flat-map',
              '    <UiResultsLoader :loading="loading" :label="t(\'searching\')" min-height="220px">\n    <section v-if="listings.length" class="flats__map-wrap"><flat-map',
              'flat loader start',
          )
          text = replace_once(
              text,
              '    <div class="flats__grid" :class="{ \'flats__grid_loading\': loading }">\n',
              '    <div class="flats__grid">\n',
              'flat grid loading class',
          )
          text = replace_once(
              text,
              '    </div>\n\n    <div ref="loadMoreSentinel" v-if="hasMore" class="flats__sentinel">',
              '    </div>\n    </UiResultsLoader>\n\n    <div ref="loadMoreSentinel" v-if="hasMore" class="flats__sentinel">',
              'flat loader end',
          )
          text = replace_once(
              text,
              '.flats__grid_loading { opacity: 0.4; pointer-events: none; }\n',
              '',
              'flat legacy loader css',
          )
          path.write_text(text)

          # Hiring: the currently rendered candidate grid is the stale result
          # surface; personal tabs reuse this same grid, so one wrapper covers all.
          path = Path("app/pages/hiring/index.vue")
          text = path.read_text()
          text = replace_once(
              text,
              '    <div class="hiring__grid" :class="{ \'hiring__grid_loading\': loading, \'hiring__grid_dense\': denseGrid }">\n',
              '    <UiResultsLoader :loading="loading" :label="t(\'searching\')" min-height="210px">\n    <div class="hiring__grid" :class="{ \'hiring__grid_dense\': denseGrid }">\n',
              'hiring loader start',
          )
          text = replace_once(
              text,
              '    </div>\n\n    <div ref="loadMoreSentinel" v-if="hasMore" class="hiring__sentinel">',
              '    </div>\n    </UiResultsLoader>\n\n    <div ref="loadMoreSentinel" v-if="hasMore" class="hiring__sentinel">',
              'hiring loader end',
          )
          # Any page-local rule is now redundant; the component owns dimming,
          # pointer blocking, stacking, spinner animation and reduced motion.
          text = text.replace('.hiring__grid_loading { opacity: 0.4; pointer-events: none; }\n', '')
          path.write_text(text)

          # The global pseudo-element implementation is retired completely.
          config = Path("nuxt.config.ts")
          text = config.read_text()
          text = replace_once(
              text,
              "    css: ['~/assets/css/main.css', '~/assets/css/results-loader.css'],\n",
              "    css: ['~/assets/css/main.css'],\n",
              'nuxt legacy loader css import',
          )
          config.write_text(text)

          legacy_css = Path("app/assets/css/results-loader.css")
          if legacy_css.exists():
              legacy_css.unlink()

          # Guard against accidentally leaving a second loader implementation.
          pages = [
              Path("app/pages/jobs/index.vue"),
              Path("app/pages/flat-finder/index.vue"),
              Path("app/pages/hiring/index.vue"),
          ]
          leftovers = []
          for page in pages:
              body = page.read_text()
              for token in ("jobs__loader", "jobs__grid_loading", "flats__grid_loading", "hiring__grid_loading"):
                  if token in body:
                      leftovers.append(f"{page}: {token}")
              if "<UiResultsLoader" not in body:
                  leftovers.append(f"{page}: UiResultsLoader missing")
          if leftovers:
              raise SystemExit("legacy loader leftovers:\n" + "\n".join(leftovers))
          PY

      - name: Validate application
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit refactor and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/refactor-results-loader.yml
          git add app/components/ui/ResultsLoader.vue app/pages/jobs/index.vue app/pages/flat-finder/index.vue app/pages/hiring/index.vue nuxt.config.ts app/assets/css/results-loader.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: use shared results loader component"
          git push origin HEAD:master
