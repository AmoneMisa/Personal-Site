name: Apply Flat Finder web walking metro

on:
  push:
    branches: [ feat/flat-walking-metro-web ]
    paths:
      - '.github/scripts/apply-flat-walking-metro-web.py'
      - '.github/workflows/apply-flat-walking-metro-web.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        run: python .github/scripts/apply-flat-walking-metro-web.py

      - name: Commit patched web files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/types/flats.ts app/pages/flat-finder/index.vue
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(flats): show walking distance to metro on web'
          git push origin HEAD:feat/flat-walking-metro-web
