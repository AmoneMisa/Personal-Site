name: Minimize parsing lexicon lockfile

on:
  push:
    branches:
      - feat/shared-parsing-lexicon
    paths:
      - '.github/workflows/minimize-parsing-lexicon-lock.yml'

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-parsing-lexicon
          fetch-depth: 0
      - name: Restore base lock and keep only lexicon entry
        shell: bash
        run: |
          cp package-lock.json /tmp/generated-package-lock.json
          git checkout origin/master -- package-lock.json
          node <<'NODE'
          const fs = require('node:fs')
          const generated = JSON.parse(fs.readFileSync('/tmp/generated-package-lock.json', 'utf8'))
          const base = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const name = '@whiteslove/parsing-lexicon'
          const key = `node_modules/${name}`
          const spec = generated.packages?.['']?.dependencies?.[name]
          const entry = generated.packages?.[key]
          if (!spec || !entry) throw new Error('Generated lexicon lock entry is missing')
          base.packages[''].dependencies[name] = spec
          base.packages[key] = entry
          fs.writeFileSync('package-lock.json', `${JSON.stringify(base, null, 2)}\n`)
          NODE
      - name: Commit minimized lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git diff --cached --quiet || git commit -m 'chore: minimize parsing lexicon lockfile diff'
          git push
