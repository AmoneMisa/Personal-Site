name: Dedupe search result grids

on:
  push:
    branches:
      - refactor/search-advanced-filters-final

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/search-advanced-filters-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage parsing lexicon for tests
        run: |
          mkdir -p node_modules/@whiteslove/parsing-lexicon
          curl -fsSL https://github.com/AmoneMisa/parsing-lexicon/archive/2aaafbbc8a064c3d5041f1185eb00f0615891ae2.tar.gz | tar -xz --strip-components=1 -C node_modules/@whiteslove/parsing-lexicon
      - name: Run focused regression tests
        run: node --experimental-strip-types --import ./tests/setup.mjs --test tests/search-component-dedup.test.mjs tests/flats-layout-and-stats.test.mjs tests/hiring-statistics.test.mjs tests/jobs-statistics.test.mjs
      - name: Remove one-off verification files
        run: rm .github/scripts/update_result_grid_tests.mjs .github/workflows/dedupe-search-result-grids.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove result grid migration helpers"
          git push origin HEAD:refactor/search-advanced-filters-final
