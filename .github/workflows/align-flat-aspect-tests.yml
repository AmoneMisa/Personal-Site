name: Align flat aspect tests

on:
  push:
    branches:
      - refactor/search-advanced-filters-final

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/search-advanced-filters-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Align stale aspect-ratio assertions
        run: node .github/scripts/align_flat_aspect_tests.mjs
      - name: Run application tests
        run: npm test
      - name: Build Nuxt application
        run: npm run build
      - name: Remove one-off migration files
        run: rm .github/scripts/align_flat_aspect_tests.mjs .github/workflows/align-flat-aspect-tests.yml
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(flats): align aspect ratio regressions"
          git push origin HEAD:refactor/search-advanced-filters-final
