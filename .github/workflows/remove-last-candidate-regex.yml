name: Remove last candidate semantic regex

on:
  push:
    branches:
      - refactor/remove-last-candidate-regex

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-last-candidate-regex
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          old='2aba40cc668d42f1c0f454538752554b82ecaad9'
          new='2aaafbbc8a064c3d5041f1185eb00f0615891ae2'
          p=Path('package.json'); s=p.read_text(); assert old in s; p.write_text(s.replace(old,new))
          p=Path('server/hiring/domain/telegramCandidateParser.ts'); s=p.read_text()
          old_line="  if (/^(?:колеги[,!\\s]*)?(?:вітаю[,!\\s]*)?рекомендую\\s+(?:класного\\s+)?кандидат\\p{L}*[.!\\s]+(?:контакт\\p{L}*\\s+та\\s+)?резюме\\s+додаю\\.?$/iu.test(compact)) return false"
          new_line="  const candidateSignals = detectCandidatePostSignals(value)\n  if (candidateSignals.emptyRecommendation) return false"
          assert old_line in s; s=s.replace(old_line,new_line,1)
          old_decl="  const candidateSignals = detectCandidatePostSignals(value)\n  const candidateForm = candidateSignals.candidateForm"
          assert old_decl in s; s=s.replace(old_decl,"  const candidateForm = candidateSignals.candidateForm",1)
          p.write_text(s)
          PY
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/remove-last-candidate-regex.yml
          git add package.json package-lock.json server/hiring/domain/telegramCandidateParser.ts
          git commit -m "refactor: remove last local candidate semantic regex"
          git push
