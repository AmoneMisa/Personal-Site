name: Fix IshBor meta salary once

on:
  push:
    branches: [refactor/shared-ishbor-meta-salary]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ishbor-meta-salary
      - name: Mark extracted meta value as salary context
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shared/hiring/ishBorProfile.ts')
          s = p.read_text()
          old = "return raw ? sourceSalary(raw) : {}"
          new = "return raw ? sourceSalary(`salary ${raw}`) : {}"
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-ishbor-meta-salary-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/hiring/ishBorProfile.ts .github/workflows/fix-ishbor-meta-salary-once.yml
          git commit -m "Preserve IshBor bare salary context"
          git push origin HEAD:refactor/shared-ishbor-meta-salary
