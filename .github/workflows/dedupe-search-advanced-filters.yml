name: Dedupe search advanced filters

on:
  push:
    branches:
      - refactor/search-advanced-filters-shell

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/search-advanced-filters-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deduplication
        run: node .github/scripts/dedupe_search_advanced_filters.mjs
      - name: Run focused regression tests
        run: node --experimental-strip-types --import ./tests/setup.mjs --test tests/flats-layout-and-stats.test.mjs tests/hiring-statistics.test.mjs
      - name: Remove one-off migration files
        run: rm .github/scripts/dedupe_search_advanced_filters.mjs .github/workflows/dedupe-search-advanced-filters.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(search): deduplicate advanced filters shell"
          git push origin HEAD:refactor/search-advanced-filters-shell
