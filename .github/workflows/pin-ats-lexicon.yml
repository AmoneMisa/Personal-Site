name: Pin fixed ATS lexicon

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/pin-ats-lexicon.yml

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update parsing lexicon pin
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('package.json')
          text = path.read_text()
          text, count = re.subn(
            r'https://github\.com/AmoneMisa/parsing-lexicon/archive/[0-9a-f]{40}\.tar\.gz',
            'https://github.com/AmoneMisa/parsing-lexicon/archive/9ab7f297534b5174233a1915d922e4ae2989d90a.tar.gz',
            text,
            count=1,
          )
          if count != 1:
            raise SystemExit(f'expected one package pin, got {count}')
          path.write_text(text)
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit pin and remove temporary workflow
        run: |
          rm .github/workflows/pin-ats-lexicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/pin-ats-lexicon.yml
          git commit -m "chore: pin fixed ATS lexicon"
          git pull --rebase origin master
          git push origin HEAD:master
