services:
  backend:
    # Existing auxiliary site backend. Jobs/hiring do NOT use this service:
    # their read API is Nuxt/Nitro (`jobs-api`) and ingestion is `jobs-worker`.
    image: ghcr.io/amonemisa/personal-site-backend:latest
    restart: unless-stopped
    environment:
      BACKEND_STATE_DIR: /var/app/state/backend
    volumes:
      - site_state:/var/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  job-browser-fetcher:
    # Lightweight Chrome TLS/JA3 impersonation for public job pages whose WAF
    # blocks Node fetch. Internal-only: no host port is published.
    image: ghcr.io/amonemisa/personal-site-job-browser-fetcher:latest
    restart: unless-stopped
    environment:
      JOB_BROWSER_IMPERSONATE: ${JOB_BROWSER_IMPERSONATE:-chrome124}
      JOB_BROWSER_TIMEOUT: ${JOB_BROWSER_TIMEOUT:-25}
      JOB_BROWSER_ATTEMPTS: ${JOB_BROWSER_ATTEMPTS:-2}
      JOB_BROWSER_RETRY_BACKOFF: ${JOB_BROWSER_RETRY_BACKOFF:-2}
      JOB_BROWSER_429_COOLDOWN: ${JOB_BROWSER_429_COOLDOWN:-900}
      JOB_BROWSER_403_COOLDOWN: ${JOB_BROWSER_403_COOLDOWN:-900}
      JOB_BROWSER_ALLOWED_HOSTS: ${JOB_BROWSER_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4040/health',timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    # Public Nuxt renderer. No queue, crawler, source adapter or ingestion task
    # executes here. Jobs/hiring data requests are proxied to another Nitro
    # process built from this same Personal-Site image.
    image: ghcr.io/amonemisa/personal-site:latest
    restart: unless-stopped
    env_file:
      - ${SITE_ENV_FILE:-./db.env}
    environment:
      SITE_STATE_DIR: /var/app/state/site
      JOBS_RUNTIME_ROLE: frontend
      JOBS_API_URL: http://jobs-api:3000
    volumes:
      - site_state:/var/app/state
    ports:
      - "127.0.0.1:8080:3000"
    networks:
      - default
      - ai-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  jobs-api:
    # Read-only Nuxt/Nitro jobs+hiring API from the SAME application image.
    # It serves stored snapshots/search only and has no refresh/queue endpoints.
    image: ghcr.io/amonemisa/personal-site:latest
    restart: unless-stopped
    env_file:
      - ${SITE_ENV_FILE:-./db.env}
    environment:
      SITE_STATE_DIR: /var/app/state/site
      JOBS_RUNTIME_ROLE: api
      JOBS_API_URL: http://jobs-api:3000
      ELASTICSEARCH_URL: http://flat-finder-elasticsearch:9200
      JOBS_ELASTICSEARCH_INDEX: job-listings-v1
      HIRING_DATABASE_URL: ${HIRING_DATABASE_URL:-}
      HIRING_DB_SCHEMA: ${HIRING_DB_SCHEMA:-hiring}
    volumes:
      - site_state:/var/app/state
    networks:
      - default
      - ai-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  jobs-worker:
    # The ONE jobs/hiring worker. It directly owns scheduling, Postgres queue
    # claim/complete/fail, scraping, parsing, normalization, AI enrichment and
    # Elasticsearch indexing. No HTTP execution hop through Nuxt exists.
    image: ghcr.io/amonemisa/personal-site-jobs-worker:latest
    restart: unless-stopped
    env_file:
      - ${SITE_ENV_FILE:-./db.env}
    environment:
      SITE_STATE_DIR: /var/app/state/site
      JOBS_RUNTIME_ROLE: worker
      AI_WORKER_URL: http://ai-worker:4030
      ELASTICSEARCH_URL: http://flat-finder-elasticsearch:9200
      JOBS_ELASTICSEARCH_INDEX: job-listings-v1
      JOB_BROWSER_FETCHER_URL: http://job-browser-fetcher:4040
      JOB_BROWSER_PROXY_TIMEOUT_MS: ${JOB_BROWSER_PROXY_TIMEOUT_MS:-65000}
      JOB_BROWSER_ALLOWED_HOSTS: ${JOB_BROWSER_ALLOWED_HOSTS:-}
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY:-}
      HIRING_SOCIAL_SOURCE: ${HIRING_SOCIAL_SOURCE:-on}
      HIRING_SOCIAL_SOURCES: ${HIRING_SOCIAL_SOURCES:-}
      HIRING_SOCIAL_API_URL: ${HIRING_SOCIAL_API_URL:-http://flat-finder-backend:4000/internal/social/fetch}
      HIRING_DATABASE_URL: ${HIRING_DATABASE_URL:-}
      HIRING_DB_SCHEMA: ${HIRING_DB_SCHEMA:-hiring}
      JOBS_QUEUE_DATABASE_URL: ${JOBS_QUEUE_DATABASE_URL:-}
      JOBS_QUEUE_DB_SCHEMA: ${JOBS_QUEUE_DB_SCHEMA:-site_queue}
      JOBS_QUEUE_REFRESH_SECONDS: ${JOBS_QUEUE_REFRESH_SECONDS:-1800}
      HIRING_QUEUE_REFRESH_SECONDS: ${HIRING_QUEUE_REFRESH_SECONDS:-1800}
      HIRING_QUEUE_BACKFILL_SECONDS: ${HIRING_QUEUE_BACKFILL_SECONDS:-300}
      HIRING_QUEUE_ENABLED: ${HIRING_QUEUE_ENABLED:-on}
      JOBS_QUEUE_MAX_ATTEMPTS: ${JOBS_QUEUE_MAX_ATTEMPTS:-5}
      JOBS_QUEUE_LEASE_SECONDS: ${JOBS_QUEUE_LEASE_SECONDS:-240}
      JOBS_QUEUE_RETRY_BASE_MS: ${JOBS_QUEUE_RETRY_BASE_MS:-30000}
      JOBS_QUEUE_RETRY_MAX_MS: ${JOBS_QUEUE_RETRY_MAX_MS:-300000}
      JOBS_QUEUE_POLL_SECONDS: ${JOBS_QUEUE_POLL_SECONDS:-1}
      JOBS_QUEUE_DISPATCH_TICK_SECONDS: ${JOBS_QUEUE_DISPATCH_TICK_SECONDS:-10}
    volumes:
      - site_state:/var/app/state
    depends_on:
      job-browser-fetcher:
        condition: service_healthy
    networks:
      - default
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  site_state:

networks:
  ai-net:
    external: true
