services:
  backend:
    # Built and pushed by GitHub Actions; the deployment server can reach
    # ghcr.io but not Docker Hub, so it must never build this locally.
    image: ghcr.io/amonemisa/personal-site-backend:latest
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  job-browser-fetcher:
    # Lightweight Chrome TLS/JA3 impersonation for public job pages whose WAF
    # blocks Node fetch. Internal-only: no host port is published.
    image: ghcr.io/amonemisa/personal-site-job-browser-fetcher:latest
    restart: unless-stopped
    environment:
      JOB_BROWSER_IMPERSONATE: ${JOB_BROWSER_IMPERSONATE:-chrome124}
      JOB_BROWSER_TIMEOUT: ${JOB_BROWSER_TIMEOUT:-25}
      JOB_BROWSER_ATTEMPTS: ${JOB_BROWSER_ATTEMPTS:-2}
      JOB_BROWSER_RETRY_BACKOFF: ${JOB_BROWSER_RETRY_BACKOFF:-2}
      JOB_BROWSER_429_COOLDOWN: ${JOB_BROWSER_429_COOLDOWN:-900}
      JOB_BROWSER_403_COOLDOWN: ${JOB_BROWSER_403_COOLDOWN:-900}
      JOB_BROWSER_ALLOWED_HOSTS: ${JOB_BROWSER_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4040/health',timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    # Deliberately NO build context: the Nuxt image is built and pushed by GitHub
    # Actions (see .github/workflows/deploy.yml, which builds ./Dockerfile
    # directly and does not use compose). With a build section here, any
    # `docker compose up -d --build` on the server re-ran the Nuxt build — the
    # source of the deployment command timeouts — and the jobs-queue-worker
    # services depend_on frontend, so even building only those triggered it.
    # To build locally: docker build -t ghcr.io/amonemisa/personal-site:latest .
    image: ghcr.io/amonemisa/personal-site:latest
    restart: unless-stopped
    env_file:
      - ${SITE_ENV_FILE:-./db.env}
    environment:
      REDIS_URL: redis://redis:6379
      AI_WORKER_URL: http://ai-worker:4030
      ELASTICSEARCH_URL: http://flat-finder-elasticsearch:9200
      JOBS_ELASTICSEARCH_INDEX: job-listings-v2
      JOB_BROWSER_FETCHER_URL: http://job-browser-fetcher:4040
      JOB_BROWSER_PROXY_TIMEOUT_MS: ${JOB_BROWSER_PROXY_TIMEOUT_MS:-65000}
      JOB_BROWSER_ALLOWED_HOSTS: ${JOB_BROWSER_ALLOWED_HOSTS:-}
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY:-}
      # Durable CV storage: the shared Postgres, in its own "hiring" schema.
      # Requires flat-finder-postgres to be on ai-net. Unset it and the board
      # falls back to Redis-only.
      HIRING_DATABASE_URL: ${HIRING_DATABASE_URL:-}
      HIRING_DB_SCHEMA: ${HIRING_DB_SCHEMA:-hiring}
    depends_on:
      backend:
        condition: service_healthy
      job-browser-fetcher:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:3000"
    networks:
      - default
      - ai-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  jobs-queue-dispatcher:
    # Built and pushed by GitHub Actions; the deployment server can reach
    # ghcr.io but not Docker Hub, so it must never build this locally.
    image: ghcr.io/amonemisa/personal-site-jobs-queue:latest
    restart: unless-stopped
    environment:
      QUEUE_MODE: dispatcher
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler}@flat-finder-rabbitmq:5672/%2F
      JOBS_FRONTEND_URL: http://frontend:3000
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY:-}
      QUEUE_REFRESH_SECONDS: ${JOBS_QUEUE_REFRESH_SECONDS:-1800}
      HIRING_QUEUE_REFRESH_SECONDS: ${HIRING_QUEUE_REFRESH_SECONDS:-1800}
      HIRING_QUEUE_ENABLED: ${HIRING_QUEUE_ENABLED:-on}
    networks:
      - default
      - ai-net
    depends_on:
      frontend:
        condition: service_healthy

  jobs-queue-worker-1:
    # Built and pushed by GitHub Actions; the deployment server can reach
    # ghcr.io but not Docker Hub, so it must never build this locally.
    image: ghcr.io/amonemisa/personal-site-jobs-queue:latest
    restart: unless-stopped
    environment:
      QUEUE_MODE: worker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler}@flat-finder-rabbitmq:5672/%2F
      JOBS_FRONTEND_URL: http://frontend:3000
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY:-}
      QUEUE_PREFETCH: ${JOBS_QUEUE_PREFETCH:-1}
      QUEUE_MAX_ATTEMPTS: ${JOBS_QUEUE_MAX_ATTEMPTS:-5}
    networks:
      - default
      - ai-net
    depends_on:
      frontend:
        condition: service_healthy

  jobs-queue-worker-2:
    # Built and pushed by GitHub Actions; the deployment server can reach
    # ghcr.io but not Docker Hub, so it must never build this locally.
    image: ghcr.io/amonemisa/personal-site-jobs-queue:latest
    restart: unless-stopped
    environment:
      QUEUE_MODE: worker
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler}@flat-finder-rabbitmq:5672/%2F
      JOBS_FRONTEND_URL: http://frontend:3000
      QUEUE_INTERNAL_KEY: ${QUEUE_INTERNAL_KEY:-}
      QUEUE_PREFETCH: ${JOBS_QUEUE_PREFETCH:-1}
      QUEUE_MAX_ATTEMPTS: ${JOBS_QUEUE_MAX_ATTEMPTS:-5}
    networks:
      - default
      - ai-net
    depends_on:
      frontend:
        condition: service_healthy

  redis:
    image: redis:8.4.0
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis_data:

networks:
  ai-net:
    external: true
