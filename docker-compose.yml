services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./db.env
    depends_on:
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      REDIS_URL: "redis://redis:6379"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:3000"

  redis:
    image: redis:8.4.0
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data

volumes:
  redis_data: