# Container logs contain client IPs and request details (personal data), so
# they are rotated rather than kept forever: at most 3 files of 10 MB per
# container. See docs/privacy/RETENTION_POLICY_DRAFT.md ("technical logs").
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    logging: *default-logging
    # Existing auxiliary Python services for the public website.
    image: ghcr.io/amonemisa/personal-site-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_STATE_DIR: /var/app/state/backend
    volumes:
      - site_state:/var/app/state
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    logging: *default-logging
    # Nuxt owns UI/SSR and same-origin BFF routes. Domain reads and all workers
    # live in whiteslove.me-backend-platform.
    image: ghcr.io/amonemisa/personal-site:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${SITE_ENV_FILE:-./db.env}
    environment:
      SITE_STATE_DIR: /var/app/state/site
      JOBS_RUNTIME_ROLE: frontend
      AI_WORKER_URL: ${AI_WORKER_URL:-http://ai-worker:4030}
      VACANCIES_API_URL: ${VACANCIES_API_URL-http://vacancies-api:4010}
      CV_API_URL: ${CV_API_URL-http://cv-api:4011}
      FLAT_API_URL: ${FLAT_API_URL:-http://flats-api:4000}
      SUBSCRIPTIONS_DATABASE_URL: ${SUBSCRIPTIONS_DATABASE_URL:-}
      SUBSCRIPTIONS_DB_SCHEMA: ${SUBSCRIPTIONS_DB_SCHEMA:-subscriptions}
      TELEGRAM_SUBSCRIPTION_BOT_USERNAME: ${TELEGRAM_SUBSCRIPTION_BOT_USERNAME:-}
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-https://whiteslove.me}
      UMAMI_URL: ${UMAMI_URL:-http://umami:3000}
    volumes:
      - site_state:/var/app/state
    ports:
      - "127.0.0.1:8080:3000"
    networks:
      - default
      - ai-net
      - backend-platform
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-768m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.5}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  umami:
    logging: *default-logging
    # Cookieless, self-hosted visitor analytics. Browsers reach only the tracker
    # script and collector through the frontend's /stats/* proxy; the dashboard
    # is bound to loopback (open it over an SSH tunnel to 127.0.0.1:3101; 3001
    # is taken by backend-platform).
    # Opt-in: deploy.sh starts it only when UMAMI_DATABASE_URL is set. Umami
    # needs its own database (not a schema of an existing one) in the shared
    # Postgres.
    profiles: ["analytics"]
    image: ghcr.io/umami-software/umami:${UMAMI_IMAGE_TAG:-postgresql-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:-}
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:${UMAMI_DASHBOARD_PORT:-3101}:3000"
    networks:
      - default
      - backend-platform
    mem_limit: ${UMAMI_MEMORY_LIMIT:-512m}
    cpus: ${UMAMI_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true

  umami-retention:
    logging: *default-logging
    # Enforces the privacy policy's 90-day retention for visit statistics:
    # runs scripts/umami-retention.sql once a day against Umami's database.
    profiles: ["analytics"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:-}
    volumes:
      # Directory mount: a single-file bind would keep the pre-deploy inode.
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c", "while true; do psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /scripts/umami-retention.sql || echo 'umami retention failed'; sleep 86400; done"]
    networks:
      - backend-platform
    mem_limit: 64m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  prometheus:
    logging: *default-logging
    # Scrapes the frontend's /metrics (server/routes/metrics.get.ts) with
    # METRICS_KEY. Opt-in: deploy.sh starts it only when METRICS_KEY is set.
    # The UI is bound to loopback (SSH tunnel to 127.0.0.1:9090); data is kept
    # for PROMETHEUS_RETENTION (default 30d).
    profiles: ["monitoring"]
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v3.5.0}
    restart: unless-stopped
    environment:
      METRICS_KEY: ${METRICS_KEY:-}
    entrypoint:
      - sh
      - -c
      - >-
        umask 077 && printf %s "$$METRICS_KEY" > /tmp/metrics_key &&
        exec /bin/prometheus
        --config.file=/etc/prometheus-site/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
        --web.listen-address=:9090
    volumes:
      # Directory mount so a deploy's updated config is visible after restart.
      - ./monitoring:/etc/prometheus-site:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true

  alertmanager:
    logging: *default-logging
    # Sends Prometheus alerts (monitoring/alerts.yml) to Telegram through the
    # subscription bot. Alertmanager cannot read env vars, so the entrypoint
    # writes the token file and fills in the chat id before starting.
    # Opt-in: deploy.sh starts it only when TELEGRAM_METRICS_CHAT_ID is set.
    profiles: ["monitoring"]
    image: prom/alertmanager:${ALERTMANAGER_IMAGE_TAG:-v0.28.1}
    restart: unless-stopped
    environment:
      TELEGRAM_SUBSCRIPTION_BOT_TOKEN: ${TELEGRAM_SUBSCRIPTION_BOT_TOKEN:-}
      TELEGRAM_METRICS_CHAT_ID: ${TELEGRAM_METRICS_CHAT_ID:-}
    entrypoint:
      - sh
      - -c
      - >-
        umask 077 && printf %s "$$TELEGRAM_SUBSCRIPTION_BOT_TOKEN" > /tmp/bot_token &&
        sed "s/__CHAT_ID__/$$TELEGRAM_METRICS_CHAT_ID/" /etc/prometheus-site/alertmanager.yml > /tmp/alertmanager.yml &&
        exec /bin/alertmanager
        --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager
    volumes:
      - ./monitoring:/etc/prometheus-site:ro
      - alertmanager_data:/alertmanager
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  metrics-digest:
    logging: *default-logging
    # Daily digest (Umami traffic + Prometheus vitals/errors) sent to Telegram
    # at METRICS_DIGEST_HOUR_UTC. Same image as the frontend; see
    # monitoring/digest.mjs. Started together with alertmanager.
    profiles: ["monitoring"]
    image: ghcr.io/amonemisa/personal-site:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["node", "monitoring/digest.mjs"]
    env_file:
      - ${SITE_ENV_FILE:-./db.env}
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    networks:
      - default
      - backend-platform
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

volumes:
  site_state:
  prometheus_data:
  alertmanager_data:

networks:
  ai-net:
    external: true
  backend-platform:
    external: true
    name: whiteslove-backend-platform
