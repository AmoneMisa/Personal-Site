server {
    listen 80;
    server_name _;

    location /admin/ {
        proxy_pass http://admin-frontend:80/;
    }

    # WebSocket endpoint (Nitro chat at server/routes/chat-ws.ws.ts).
    # WebSockets need the HTTP/1.1 Upgrade handshake forwarded explicitly;
    # without this block the connection can't upgrade and the chat fails.
    location /chat-ws {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:3000/;
    }
}
